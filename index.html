function getGauntletPool(){
  let pool = [];
  for(let c=1; c<=game.chapter; c++){ if(ENEMY_POOLS[c]) pool = pool.concat(ENEMY_POOLS[c]); }
  return pool.length ? pool : ENEMY_POOLS[1];
}
function openGauntletSetup(){
  showModal(`
    <h2 style="color:var(--ap); text-align:center; margin-bottom:6px;">⚔️ The Gauntlet</h2>
    <p class="segnote" style="text-align:center; margin-bottom:12px;">Endless escalating waves, drawn from enemies you've already encountered. If you fall, the run ends and you keep everything earned so far. Optional mutators make it harder for no extra reward — pure bragging rights.</p>
    <div class="col">
      ${Object.keys(GAUNTLET_MUTATORS).map(k=>`
        <div class="toggle"><span>${GAUNTLET_MUTATORS[k].name} — <span class="segnote">${GAUNTLET_MUTATORS[k].desc}</span></span>
          <button class="small" onclick="game.gauntletMutators['${k}']=!game.gauntletMutators['${k}']; openGauntletSetup();">${game.gauntletMutators[k]?'ON':'OFF'}</button>
        </div>`).join('')}
    </div>
    <div class="btnrow" style="justify-content:center; margin-top:14px;">
      <button class="primary" onclick="closeModal(); startGauntletWave(1);">Begin</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  `);
}
function startGauntletWave(wave){
  game.gauntletWave = wave;
  const pool = getGauntletPool();
  const base = pool[Math.floor(Math.random()*pool.length)];
  const scale = 1 + (wave-1)*0.14;
  const t = {id:'g1', name:`${base.name} (Wave ${wave})`, hp:Math.floor(base.hp*scale), atk:Math.floor(base.atk*scale),
             telegraph:null, xp:Math.floor(base.xp*scale*0.8), gold:Math.floor(base.gold*scale*0.8), traits: base.traits ? base.traits.slice() : []};
  t.maxHp = t.hp;
  beginFight([t], {kind:'gauntlet', mutators:Object.assign({}, game.gauntletMutators)});
}

function beginFight(targets, opts){
  turnLock = false;
  startMusic((opts.kind==='boss'||opts.kind==='superboss'||opts.kind==='rival') ? 'intense' : 'ambient');
  fight = {
    targets, opts,
    selected: targets[0].id,
    ap: infAP() ? 99 : getMaxAP(),
    ashwalkerStacks:0,
    infectionStacks:0,
    abilityCd:0,
    guaranteedCrit:false,
    guardActive:false,
    usedActive:false,
    log:[`<div class="info">The fight begins...</div>`],
    zones:{},
    round:1,
    resurgence: (opts.bossConfig && opts.bossConfig.resurgence) ? {threshold:opts.bossConfig.resurgence.threshold, triggered:false} : null,
    enrage: (opts.bossConfig && opts.bossConfig.enrage) ? {threshold:opts.bossConfig.enrage.threshold, atkMultBonus:opts.bossConfig.enrage.atkMultBonus, triggered:false} : null,
    showTutorial: !game.tutorialSeen,
    stance:'balanced',
    momentum:0,
    lastAction:null,
    repeatStreak:0,
    patternWarning:false,
    punishThisRound:false,
    lowHpWarned:false,
    bleed:null
  };
  game.tutorialSeen = true;
  fight.ap = infAP() ? 99 : getMaxAP();
  targets.forEach(t=>rollTelegraph(t));
  renderFight();
}

function enemyIcon(t){
  const n = (t.name||'').toLowerCase();
  const map = [['dark lord','👑'],['patient zero','🦠'],['hound','🐺'],['wretch','🧟'],['wisp','✨'],['swarm','🐝'],['sentry','🗿'],['sentinel','🗿'],['colossus','🗿'],
    ['claw','🦀'],['choir','🎶'],['voice','🎶'],['echo','👻'],['shade','👻'],['wraith','👻'],['zealot','🔥'],['reaver','🪓'],['duelist','🤺'],['kess','🤺'],['orven','🛡️'],
    ['maren','🖐️'],['nyx','🌑'],['vex','📜'],['warden','🛡️'],['knight','⚔️'],['vine','🌿'],['bloom','🌸'],['thorn','🌿'],['growth','🌿'],['sovereign','👑'],['root','🌳'],
    ['spore','🍄'],['husk','🥀'],['tide','🌊'],['drowned','🌊'],['undertow','🌊'],['brine','🌊'],['silt','🌊'],['fin','🦈'],['hull','⚓'],['wrought','⚙️'],['fracturewright','⚙️'],
    ['unwritten','📜'],['mirror','🪞'],['twin','👥'],['watcher','👁️'],['recursion','♾️'],['seam','🧵'],['facet','💎'],['strain','🦠'],['carrier','🦠'],['vector','🦠'],
    ['plague','🦠'],['contagion','🦠'],['infected','🦠'],['fracture','⚡']];
  for(const [k,i] of map) if(n.includes(k)) return i;
  return t.isChampion ? '⭐' : (t.isCore ? '👑' : '👹');
}
function isBossLike(kind){ return kind==='boss' || kind==='superboss'; }
function rollTelegraph(t){
  if(fight && isBossLike(fight.opts.kind) && !t.isCore){ t.telegraph=null; return; }
  const doubled = fight && fight.opts.kind==='gauntlet' && fight.opts.mutators && fight.opts.mutators.doubleTelegraph;
  const r = Math.random();
  if(doubled){
    if(r<0.25) t.telegraph='normal';
    else if(r<0.64) t.telegraph='heavy';
    else t.telegraph='drain';
    return;
  }
  if(r<0.55) t.telegraph='normal';
  else if(r<0.82) t.telegraph='heavy';
  else t.telegraph='drain';
}
function aliveTargets(){ return fight.targets.filter(t=>t.hp>0); }
function selectedTarget(){ return fight.targets.find(t=>t.id===fight.selected && t.hp>0) || aliveTargets()[0]; }
function selectTarget(id){ fight.selected=id; renderFight(); }
function logf(html){ fight.log.push(`<div>${html}</div>`); if(fight.log.length>50) fight.log.shift(); }

function effectiveRole(t){
  if(t.role==='phase') return (t.phaseIdx%2===0) ? 'shield' : 'buffer';
  return t.role;
}
function shieldReduction(){
  let r=0; fight.targets.forEach(t=>{ if(effectiveRole(t)==='shield' && t.hp>0) r += (t.shieldPct||0); });
  return Math.min(0.85, r);
}
function buffMultiplier(){
  let m=1; fight.targets.forEach(t=>{ if(effectiveRole(t)==='buffer' && t.hp>0) m += (t.buffPct||0); });
  return m;
}
function segmentRoleNote(t){
  const r = effectiveRole(t);
  const repl = (t.replicates && !t.hasReplicated) ? ' · 🦠 Splits into a fresh copy once when killed' : '';
  if(t.role==='phase') return `Phasing: currently ${r==='shield'?`🛡 Shielding the Core (-${Math.round((t.shieldPct||0)*100)}%)`:`📣 Empowering the Core (+${Math.round((t.buffPct||0)*100)}%)`} — flips next round${t.heals?' · Can heal the Core mid-fight':''}${repl}`;
  if(r==='shield') return `Shields the Core: -${Math.round((t.shieldPct||0)*100)}% damage to Core while alive${repl}`;
  if(r==='buffer') return `Empowers the Core: +${Math.round((t.buffPct||0)*100)}% Core Attack while alive${repl}`;
  if(t.heals) return `Can heal the Core mid-fight${repl}`;
  if(repl) return repl.replace(' · ','');
  return '';
}

function livingCores(){ return fight.targets.filter(t=>t.isCore && t.hp>0); }
function checkResurgence(){
  if(!fight || !fight.resurgence || fight.resurgence.triggered) return;
  const cores = livingCores();
  if(!cores.length) return;
  if(cores.some(c=>c.hp/c.maxHp <= fight.resurgence.threshold)){
    fight.resurgence.triggered = true;
    let revived=false;
    fight.targets.forEach(t=>{ if(!t.isCore && t.hp<=0){ t.hp=Math.floor(t.maxHp*0.5); revived=true; } });
    if(revived) logf(`<div class="special">⚖️ Something remembers what it lost. The fallen rise again, weakened.</div>`);
  }
}
function checkEnrage(){
  if(!fight || !fight.enrage || fight.enrage.triggered) return;
  const cores = livingCores();
  if(!cores.length) return;
  if(cores.some(c=>c.hp/c.maxHp <= fight.enrage.threshold)){
    fight.enrage.triggered = true;
    cores.forEach(c=>{ c.atk = Math.floor(c.atk*(1+fight.enrage.atkMultBonus)); });
    logf(`<div class="special" style="color:#fb8b3f;">🔥 Something in it gives up on holding back. Its attacks hit noticeably harder from here on.</div>`);
  }
}

function renderFight(){
  if(!fight) return;
  checkResurgence();
  checkEnrage();
  const opts = fight.opts;
  const allDead = isBossLike(opts.kind) ? fight.targets.filter(t=>t.isCore).every(t=>t.hp<=0) : aliveTargets().length===0;

  if(allDead) return fightVictory();
  if(game.hp<=0 && !game.sandbox.godMode) return fightDefeat();

  if(activeSetPieces()) game.stats.setSeen = true;

  const cls = CLASSES[game.cls];
  const infiniteApOn = infAP();
  const apPips = infiniteApOn
    ? `<span style="color:var(--ap);">∞ Infinite AP (sandbox)</span>`
    : Array.from({length:getMaxAP()}).map((_,i)=>`<div class="ap-pip ${i<fight.ap?'full':''}"></div>`).join('');

  const shieldPct = shieldReduction(), buffMult = buffMultiplier();
  const targetCards = fight.targets.map(t=>{
    const dead = t.hp<=0;
    const pct = Math.max(0,(t.hp/t.maxHp)*100);
    const zones = (fight.zones[t.id]||[]).map(z=>`<span class="zone-tag ${ELEMENTS[z.el].cls}">${ELEMENTS[z.el].icon} ${ELEMENTS[z.el].name}</span>`).join('');
    const tg = (!dead && t.telegraph && t.telegraph!=='normal' && t.role!=='shield') ? `<div class="telegraph ${t.telegraph==='heavy'?'tg-heavy':'tg-drain'}">${t.telegraph==='heavy'?'⚠ heavy strike incoming':'🩸 draining strike incoming'}</div>` : '';
    let roleNote = segmentRoleNote(t);
    const traitsNote = (t.traits && t.traits.length) ? `<div class="segnote">${t.traits.map(tr=>`${CHAMPION_TRAITS[tr].icon} ${tr}`).join(' · ')}</div>` : '';
    if(t.isCore){
      const bits=[];
      if(shieldPct>0) bits.push(`🛡 Shielded: -${Math.round(shieldPct*100)}% damage taken`);
      if(buffMult>1) bits.push(`📣 Empowered: +${Math.round((buffMult-1)*100)}% Attack`);
      if(fight.enrage && fight.enrage.triggered) bits.push(`🔥 Enraged: permanent Attack boost`);
      roleNote = bits.join(' · ');
    }
    return `<div class="target-card ${t.id===fight.selected&&!dead?'sel':''} ${dead?'dead':''} ${t.isElite?'elite':''}" onclick="${dead?'':`selectTarget('${t.id}')`}">
      <div class="target-name">${dead?'💀 ':enemyIcon(t)+' '}${t.name}</div>
      <div class="barbg"><div class="barfill hpfill" style="width:${pct}%"></div></div>
      <div class="segnote">${t.hp}/${t.maxHp} HP</div>
      ${roleNote?`<div class="segnote">${roleNote}</div>`:''}
      ${traitsNote}
      ${zones}${tg}
    </div>`;
  }).join('');

  const st = selectedTarget();
  const canAbility = fight.abilityCd<=0 && (fight.ap>=cls.ability.cost || infiniteApOn);
  const canPower = (fight.ap>=2 || infiniteApOn) && st;
  const inWorld2 = inCorruptionZone();
  const inWorld5 = inInfectionZone();
  const canFlee = opts.kind==='regular' || opts.kind==='champion';
  const priorityTargets = isBossLike(opts.kind) ? fight.targets.filter(t=>!t.isCore && t.hp>0 && (effectiveRole(t)==='shield'||effectiveRole(t)==='buffer')) : [];
  const strategyHint = (isBossLike(opts.kind) && fight.round<=2 && priorityTargets.length)
    ? `<div class="hint">💡 <strong>${priorityTargets.map(t=>t.name).join(' and ')}</strong> ${priorityTargets.length>1?'are':'is'} ${priorityTargets.some(t=>effectiveRole(t)==='shield')?'shielding':'empowering'} the Core while alive — clearing ${priorityTargets.length>1?'them':'it'} first will make finishing the Core much faster.</div>`
    : '';

  const patternBanner = fight.patternWarning
    ? `<div class="hint" style="border-color:rgba(255,179,71,.4); background:linear-gradient(135deg, rgba(255,179,71,.12), rgba(255,107,125,.06));">👁️ <strong>It's reading your pattern.</strong> Repeat that same move again and it punishes the hit — switch it up this round.</div>`
    : '';
  const stanceButtons = Object.keys(STANCES).map(k=>{
    const s = STANCES[k]; const active = fight.stance===k;
    return `<button class="small ${active?'primary':''}" onclick="setStance('${k}')" title="${s.desc}">${s.icon} ${s.name}${active?' ✓':''}</button>`;
  }).join('');

  render(`
    <div class="col">
      <div class="panel">
        <div class="eyebrow">Action Points — round ${fight.round}</div>
        <div class="ap-track">${apPips}</div>
      </div>
      <div class="panel">
        <div class="eyebrow">Stance — ${curStance().desc}</div>
        <div class="btnrow" style="margin-top:0;">${stanceButtons}</div>
      </div>
      <div class="panel">
        <div class="eyebrow" style="color:var(--gold);">💥 Momentum</div>
        <div class="barbg"><div class="barfill xpfill" style="width:${fight.momentum}%; ${canUnleash()?'box-shadow:0 0 10px var(--gold);':''}"></div></div>
        <p class="segnote">${fight.momentum}/${MAX_MOMENTUM}${canUnleash()?' — ready!':' — builds as you act.'}</p>
      </div>
      <div class="row">${targetCards}</div>
      ${(opts.kind==='gauntlet' && opts.mutators && Object.keys(opts.mutators).some(k=>opts.mutators[k])) ? `<div class="segnote" style="text-align:center;">🎛️ Mutators: ${Object.keys(opts.mutators).filter(k=>opts.mutators[k]).map(k=>GAUNTLET_MUTATORS[k].name).join(', ')}</div>` : ''}
      ${patternBanner}
      ${strategyHint}
      <div class="log" role="log" aria-live="polite">${fight.log.join('')}</div>
      <div class="panel">
        <div class="btnrow">
          <button onclick="doAttack()" ${st?'':'disabled'}>⚔️ Attack (free)</button>
          <button onclick="doPower()" ${canPower?'':'disabled'}>💥 Power Strike (2 AP)</button>
          <button onclick="doGuard()" ${(opts.kind==='gauntlet' && opts.mutators && opts.mutators.noGuard)?'disabled':''}>🛡️ Guard (+2 AP, reduces damage${fight.guardCounterPct?', counters':''})</button>
          <button onclick="doAbility()" ${canAbility?'':'disabled'}>${cls.ability.icon} ${cls.ability.name} (${cls.ability.cost} AP)${fight.abilityCd>0?` — cd ${fight.abilityCd}`:''}</button>
          <button class="primary" onclick="doUnleash()" ${canUnleash()?'':'disabled'}>💥 Unleash${canUnleash()?'!':` (${fight.momentum}/${MAX_MOMENTUM})`}</button>
          ${game.trinketActive && !fight.usedActive ? `<button onclick="useActiveTrinket()">${(TRINKETS_ACTIVE[game.trinketActive]||{}).icon||'🕳️'} ${game.trinketActive}</button>` : ''}
          ${game.consumables.heal>0 ? `<button onclick="useConsumable('heal')">🧪 Draught (${game.consumables.heal})</button>` : ''}
          ${game.consumables.focus>0 ? `<button onclick="useConsumable('focus')">⚗️ Tonic (${game.consumables.focus})</button>` : ''}
          ${canFlee ? `<button class="ghost" onclick="attemptFlee()">🏃 Flee (60%)</button>` : ''}
          ${opts.kind==='regular' ? `<button class="ghost" onclick="autoResolveFight()">⚡ Auto-Resolve</button>` : ''}
        </div>
        <p class="segnote" style="margin-top:8px;">Keys: 1 Attack · 2 Power Strike · 3 Guard · 4 Ability · 5 Unleash</p>
        ${opts.sandbox ? `<div class="btnrow"><button class="ghost small" onclick="sandboxForceKillSegment()">🧪 Force-kill selected segment</button><button class="ghost small" onclick="sandboxToggleGod()">🧪 God Mode: ${game.sandbox.godMode?'ON':'OFF'}</button></div>` : ''}
      </div>
      <div class="panel">
        <div class="statline"><span>❤️ Your HP${fight.bleed?` · 🗡️ Bleeding (${fight.bleed.rounds})`:''}</span><span>${game.hp}/${game.maxHp}</span></div>
        <div class="barbg"><div class="barfill hpfill" style="width:${Math.max(0,game.hp/game.maxHp*100)}%"></div></div>
      </div>
      ${inWorld2 ? `<div class="panel">
        <div class="eyebrow" style="color:#a3e635;">🌿 Corruption</div>
        <div class="barbg"><div class="barfill" style="width:${game.corruption}%; background:linear-gradient(90deg,#365314,#84cc16,#38bdf8);"></div></div>
        <p class="segnote">${game.corruption}/${MAX_CORRUPTION} — boosts your damage the higher it climbs, but theirs too. Guard vents it off.</p>
      </div>` : ''}
      ${inWorld5 ? `<div class="panel">
        <div class="eyebrow" style="color:#8fe36b;">🦠 Infection</div>
        <div class="barbg"><div class="barfill" style="width:${(fight.infectionStacks/MAX_INFECTION)*100}%; background:linear-gradient(90deg,#14532d,#4ade80,#fef08a);"></div></div>
        <p class="segnote">${fight.infectionStacks}/${MAX_INFECTION} stacks — enemy hits can add stacks; each stack burns HP at the end of every round. Guard burns off 2 stacks.</p>
      </div>` : ''}
      ${fight.showTutorial ? `<div class="hint"><strong>How this works:</strong> Attack is free. Power Strike and your Ability cost AP — but killing something refunds AP, so a clean kill can chain straight into your next big hit. Guard reduces incoming damage and refunds a little AP too. Watch the banner over an enemy: orange means a heavy hit is coming, purple means it'll try to drain you — Guard through either. Your Stance (switch anytime, free) trades damage dealt for damage taken. Acting builds Momentum toward a free Unleash. Repeating the same move too many times in a row gets read and punished — mix it up. And on ordinary fights (not Champions or bosses), ⚡ Auto-Resolve skips straight to the outcome if you'd rather not click through one. Keyboard: 1–5 trigger Attack, Power Strike, Guard, Ability and Unleash. This won't show again.</div>` : ''}
    </div>
  `);
}

function elementOnHit(){
  const w = WEAPONS[game.weapon];
  const sockets = game.socketsOn[game.weapon]||[];
  const els = new Set(sockets); if(w.element) els.add(w.element);
  return [...els];
}
function applyZone(targetId, el){
  if(!fight.zones[targetId]) fight.zones[targetId]=[];
  const existing = fight.zones[targetId].find(z=>z.el===el);
  const dur = 3 + effectMods('burnRounds');
  if(existing) existing.rounds = Math.max(existing.rounds, dur);
  else fight.zones[targetId].push({el, rounds:dur});
}
function handleTraitOnDeath(t){
  if(t.traits && t.traits.includes('Volatile')){
    const dmg = 18+Math.floor(Math.random()*10);
    if(!game.sandbox.godMode) game.hp = Math.max(0, game.hp-dmg);
    logf(`<span class="dmg">💥 It detonates as it dies — you take ${dmg}.</span>`);
  }
}
function dealDamage(t, dmg){
  if(dmg<=0 || t.hp<=0) return;
  t.hp = Math.max(0, t.hp-dmg);
  game.stats.damageDealt += dmg;
  if(t.hp<=0){
    if(t.replicates && !t.hasReplicated){
      t.hasReplicated = true;
      t.hp = Math.max(1, Math.floor(t.maxHp*0.5));
      logf(`<span class="special">🦠 ${t.name} splits before it dies — a fresh strain rises in its place.</span>`);
      return;
    }
    game.stats.kills++;
    logf(`<span class="heal">✅ ${t.name} falls.</span>`);
    const kh = effectMods('killHeal');
    if(kh>0 && game.hp>0){ const h = Math.floor(game.maxHp*kh); game.hp = Math.min(game.maxHp, game.hp+h); logf(`<span class="heal">💚 The kill steadies you — +${h} HP.</span>`); }
    if(!t.isCore){
      const noRefund = fight.opts.kind==='gauntlet' && fight.opts.mutators && fight.opts.mutators.noKillRefund;
      if(!noRefund){
        const refund = 2;
        fight.ap = infAP() ? fight.ap : Math.min(getMaxAP(), fight.ap+refund);
        logf(`<span class="special">⚡ Kill refunds ${refund} AP.</span>`);
      }
      if(t.role==='shield') logf(`<span class="special">🛡 The shield falls — the Core is exposed.</span>`);
      if(t.role==='buffer') logf(`<span class="special">📣 The chorus grows quieter.</span>`);
      handleTraitOnDeath(t);
    }
  }
}

function inCorruptionZone(){ return !!(fight && game.chapter>=4 && fight.opts.kind!=='gauntlet' && fight.opts.kind!=='superboss' && fight.opts.kind!=='rival'); }
function inInfectionZone(){ return !!(fight && game.chapter>=10 && fight.opts.kind!=='gauntlet' && fight.opts.kind!=='superboss' && fight.opts.kind!=='rival'); }

function performAttack(baseMultOverride){
  const t = selectedTarget(); if(!t) return;
  if(t.traits && t.traits.includes('Elusive') && Math.random()<0.2){
    logf(`<span class="info">💨 ${t.name} slips out of the way — your attack misses.</span>`);
    updatePillbar();
    renderFight();
    return;
  }
  let dmg = getTotalAtk() + Math.floor(Math.random()*8);
  let isCrit = fight.guaranteedCrit || Math.random()<getCrit();
  if(fight.opts.kind==='gauntlet' && fight.opts.mutators && fight.opts.mutators.noCrits) isCrit=false;
  if(fight.guaranteedCrit) fight.guaranteedCrit=false;
  if(baseMultOverride) dmg = Math.floor(dmg*baseMultOverride);
  if(isCrit){ dmg = Math.floor(dmg*(2.1+effectMods('critDmg'))); game.stats.crits++; }
  const w = WEAPONS[game.weapon];
  if(w.special==='defconvert') dmg += Math.floor(getTotalDef()*0.5);
  if(t.marked) dmg = Math.floor(dmg*1.15);
  if(t.isCore) dmg = Math.floor(dmg*(1-shieldReduction()));
  if(t.traits && t.traits.includes('Armored')) dmg = Math.floor(dmg*0.75);
  if(inCorruptionZone() && game.corruption>0){
    dmg += Math.floor(dmg*(game.corruption/MAX_CORRUPTION)*(w.special==='corruptedge'?0.45:0.22));
  }
  if(fight.opts.kind==='gauntlet' && fight.opts.mutators && fight.opts.mutators.glassCannon) dmg = Math.floor(dmg*1.5);
  if(activeSetPieces()==='corruptor' && inCorruptionZone() && game.corruption>=50) dmg = Math.floor(dmg*1.15);
  dmg = Math.floor(dmg*curStance().dmgDealtMult);

  logf(`<span class="${isCrit?'crit':'dmg'}">${isCrit?'💥 CRIT':'⚔️'} You hit ${t.name} for ${dmg}.</span>`);
  floatNum(`-${dmg}`, isCrit?'fl-crit':'fl-dmg');
  if(isCrit){ sfxCrit(); shakeScreen(false); } else sfxHit();
  dealDamage(t, dmg);
  if(t.traits && t.traits.includes('Thorned') && dmg>0 && !game.sandbox.godMode){
    const refl = Math.max(1, Math.min(Math.floor(dmg*0.08), Math.floor(game.maxHp*0.06)));
    game.hp = Math.max(0, game.hp-refl);
    logf(`<span class="dmg">🌵 Thorns bite back — you take ${refl}.</span>`);
  }
  if(inCorruptionZone()) game.corruption = Math.min(MAX_CORRUPTION, game.corruption+4);

  if(w.special==='lifesteal' && dmg>0){
    const heal = Math.floor(dmg*0.2);
    if(heal>0){ game.hp = Math.min(game.maxHp, game.hp+heal); logf(`<span class="heal">🩸 Rootfang drinks deep — +${heal} HP.</span>`); }
  }

  elementOnHit().forEach(el=>{
    if(t.hp>0){
      if(el==='fire' && isCrit){ applyZone(t.id,'fire'); logf(`<span class="special">🔥 ${t.name} catches fire.</span>`); }
      if(el==='frost'){ t.chilled = true; }
      if(el==='voidt' && !t.marked){ t.marked = true; logf(`<span class="special">🌀 ${t.name} is marked — it'll take extra damage from here on.</span>`); }
    }
  });

  if(isCrit && activeSetPieces()==='stormcaller'){
    const others = aliveTargets().filter(o=>o.id!==t.id);
    if(others.length){
      const chainTarget = others[Math.floor(Math.random()*others.length)];
      const chainDmg = Math.floor(dmg*0.3);
      logf(`<span class="special">⚡ Storm Chain arcs to ${chainTarget.name} for ${chainDmg}!</span>`);
      dealDamage(chainTarget, chainDmg);
    }
  }
  updatePillbar();
  renderFight();
}

// Auto-Resolve — skips a filler ("regular") fight straight to its outcome, for players who don't
// want to manually click through a fight that was never meant to be a real decision. Deliberately
// scoped to kind==='regular' only; Champions, bosses, Rivals, and Gauntlet waves still play out
// normally since those are the fights the combat rework was actually built for. Runs synchronously
// (no setTimeout pacing) using the same performAttack/resolveEnemyTurn primitives as manual play,
// just with a simple built-in "attack, guard the telegraphed hit" loop standing in for clicks.
let autoMode = false;
function autoResolveFight(){
  if(!fight || fight.opts.kind!=='regular' || turnLock) return;
  sfxClick();
  autoMode = true;
  const cls = CLASSES[game.cls];
  let rounds = 0, stopped = false;
  try{
    while(fight && rounds < 100){
      if(game.hp < game.maxHp*0.3 && !game.sandbox.godMode){
        logf(`<span class="info">⚡ Auto-Resolve pauses — you're running low on health. Your call.</span>`);
        stopped = true; break;
      }
      if(!selectedTarget()) break;
      fight.repeatStreak = 0; fight.lastAction = null; fight.patternWarning = false;
      const danger = aliveTargets().some(t=>t.telegraph==='heavy' || t.telegraph==='drain');
      if(canUnleash()){ doUnleash(); }
      else if(fight.abilityCd<=0 && (fight.ap>=cls.ability.cost || infAP()) && (game.cls==='rogue' || game.hp<game.maxHp*0.65)){
        doAbility();
        if(game.cls==='rogue' && fight){ gainMomentum(8); performAttack(); }
      }
      else if(danger){ doGuard(); }
      else { gainMomentum(8); performAttack(); }
      if(fight) resolveEnemyTurn();
      rounds++;
    }
  } finally { autoMode = false; }
  if(fight && stopped) renderFight();
}
let turnLock = false;
function finishPlayerTurn(){
  if(!fight || autoMode) return;
  turnLock = true;
  setTimeout(()=>{ turnLock = false; if(fight) resolveEnemyTurn(); }, delay(320,90));
}
function doAttack(){ if(turnLock) return; sfxClick(); recordAction('attack'); gainMomentum(8); performAttack(); finishPlayerTurn(); }
function doPower(){
  if(turnLock) return;
  if(!(fight.ap>=2 || infAP())) return;
  sfxClick();
  if(!infAP()) fight.ap -= 2;
  recordAction('power'); gainMomentum(14);
  performAttack(1.8);
  finishPlayerTurn();
}
function doGuard(){
  if(turnLock) return;
  if(fight.opts.kind==='gauntlet' && fight.opts.mutators && fight.opts.mutators.noGuard) return;
  sfxClick();
  recordAction('guard'); gainMomentum(6);
  fight.guardActive = true;
  fight.ap = infAP() ? fight.ap : Math.min(getMaxAP(), fight.ap+2+effectMods('guardAP'));
  logf('<span class="info">🛡️ You brace for impact.</span>');
  if(inCorruptionZone() && game.corruption>0){
    const vent = ARMOR[game.armor].special==='corruptguard' ? 25 : 15;
    const vented = Math.min(game.corruption, vent);
    game.corruption -= vented;
    logf(`<span style="color:#a3e635;">🌿 Bracing vents ${vented} Corruption.</span>`);
  }
  if(inInfectionZone() && fight.infectionStacks>0){
    const cured = Math.min(fight.infectionStacks, 2);
    fight.infectionStacks -= cured;
    logf(`<span style="color:#8fe36b;">🦠 Bracing burns off ${cured} Infection stack${cured===1?'':'s'}.</span>`);
  }
  updatePillbar();
  renderFight();
  finishPlayerTurn();
}
function attemptFlee(){
  if(turnLock) return;
  if(!fight || !(fight.opts.kind==='regular' || fight.opts.kind==='champion')) return;
  sfxClick();
  if(Math.random()<0.6){
    logf('<span class="heal">✅ You break off and escape.</span>');
    render(`
      <div class="panel" style="text-align:center;">
        <h2 style="color:var(--good); margin-bottom:10px;">🏃 Escaped</h2>
        <p style="color:var(--dim);">You live to fight another day — nothing lost but the attempt.</p>
        <div class="btnrow" style="justify-content:center; margin-top:14px;"><button class="primary" onclick="screenHub()">Continue →</button></div>
      </div>
    `);
    fight = null;
  } else {
    logf('<span class="dmg">❌ You fail to escape!</span>');
    updatePillbar();
    renderFight();
    finishPlayerTurn();
  }
}
function doAbility(){
  if(turnLock) return;
  const cls = CLASSES[game.cls];
  if(fight.abilityCd>0 || !(fight.ap>=cls.ability.cost || infAP())) return;
  sfxClick();
  if(!infAP()) fight.ap -= cls.ability.cost;
  fight.abilityCd = cls.ability.cd;
  recordAction('ability'); gainMomentum(10);
  if(game.cls==='warrior'){
    const healAmt = Math.floor(game.maxHp*0.12);
    game.hp = Math.min(game.maxHp, game.hp+healAmt);
    game.effects.push({name:'Rally', mods:{atk:9, dmgTakenPct:-0.15}, duration:'timed', roundsLeft:3});
    sfxHeal();
    logf(`<span class="special">📢 Rally! +9 Attack and 15% less damage taken for 3 rounds, and the shout steadies you for +${healAmt} HP.</span>`);
    renderFight(); finishPlayerTurn();
  } else if(game.cls==='rogue'){
    fight.guaranteedCrit = true;
    fight.ap = infAP() ? fight.ap : Math.min(getMaxAP(), fight.ap+2);
    const healAmt = Math.floor(game.maxHp*0.10);
    game.hp = Math.min(game.maxHp, game.hp+healAmt);
    game.effects.push({name:'Void Step Focus', mods:{dmgTakenPct:-0.25}, duration:'timed', roundsLeft:2});
    logf(`<span class="special">🌀 Void Step — your next hit is guaranteed to crit, +2 AP, +${healAmt} HP, and 25% less damage taken for 2 rounds.</span>`);
    updatePillbar(); renderFight();
  } else if(game.cls==='mystic'){
    aliveTargets().forEach(t=>applyZone(t.id,'fire'));
    const healAmt = Math.floor(game.maxHp*0.10);
    game.hp = Math.min(game.maxHp, game.hp+healAmt);
    game.effects.push({name:'Ember Ward', mods:{dmgTakenPct:-0.40}, duration:'timed', roundsLeft:2});
    logf(`<span class="special">🔥 Ember Weave ignites everything still standing; the backwash heals +${healAmt} HP and shields you for 40% less damage taken for 2 rounds.</span>`);
    renderFight(); finishPlayerTurn();
  } else if(game.cls==='paladin'){
    const healAmt = Math.floor(game.maxHp*0.10);
    game.hp = Math.min(game.maxHp, game.hp+healAmt);
    game.effects.push({name:'Sacred Ward', mods:{dmgTakenPct:-0.5}, duration:'timed', roundsLeft:2});
    sfxHeal();
    logf(`<span class="heal">🕊️ Sacred Ward — +${healAmt} HP, and 50% less damage taken for 2 rounds.</span>`);
    renderFight(); finishPlayerTurn();
  }
}
function doUnleash(){
  if(turnLock || !canUnleash()) return;
  sfxClick();
  shakeScreen(true);
  recordAction('unleash');
  fight.momentum = 0;
  const t = selectedTarget();
  if(game.cls==='warrior'){
    logf('<span class="crit">💥 Unleashed! A single devastating blow.</span>');
    performAttack(3.0);
    game.effects.push({name:'Momentum Grit', mods:{dmgTakenPct:-0.2}, duration:'timed', roundsLeft:1});
  } else if(game.cls==='rogue'){
    fight.guaranteedCrit = true;
    logf('<span class="crit">💥 Unleashed! Two guaranteed strikes.</span>');
    performAttack(1.4);
    if(fight){ fight.guaranteedCrit = true; performAttack(1.4); }
  } else if(game.cls==='mystic'){
    logf('<span class="crit">💥 Unleashed! The field ignites and burns.</span>');
    if(t) aliveTargets().forEach(x=>applyZone(x.id,'fire'));
    performAttack(2.2);
  } else if(game.cls==='paladin'){
    const healAmt = Math.floor(game.maxHp*0.25);
    game.hp = Math.min(game.maxHp, game.hp+healAmt);
    sfxHeal();
    logf(`<span class="heal">💥 Unleashed! +${healAmt} HP, then a righteous strike.</span>`);
    performAttack(2.6);
  }
  updatePillbar();
  if(fight) finishPlayerTurn();
}
function useActiveTrinket(){
  if(turnLock || !game.trinketActive || fight.usedActive) return;
  sfxClick();
  fight.usedActive = true;
  gainMomentum(6);
  if(game.trinketActive==='Pocket Rift'){
    const healAmt = Math.floor(game.maxHp*0.15);
    game.hp = Math.min(game.maxHp, game.hp+healAmt);
    sfxHeal();
    logf(`<span class="heal">🕳️ Pocket Rift — you're cleansed, +${healAmt} HP.</span>`);
  } else if(game.trinketActive==='Sundering Charge'){
    const t = selectedTarget();
    if(t){
      const burst = Math.floor(getTotalAtk()*1.5);
      logf(`<span class="crit">💢 Sundering Charge tears through ${t.name}'s defenses for ${burst} true damage!</span>`);
      floatNum(`-${burst}`, 'fl-crit');
      dealDamage(t, burst);
    }
  }
  updatePillbar();
  renderFight();
  finishPlayerTurn();
}
function useConsumable(k){
  if(turnLock || !fight || !game.consumables[k]) return;
  sfxClick();
  if(k==='heal'){
    if(game.hp>=game.maxHp){ logf(`<span class="info">You're already at full health.</span>`); renderFight(); return; }
    game.consumables.heal--;
    const h = Math.floor(game.maxHp*0.35);
    game.hp = Math.min(game.maxHp, game.hp+h);
    fight.bleed = null;
    gainMomentum(4);
    sfxHeal();
    logf(`<span class="heal">🧪 Healing Draught — +${h} HP.</span>`);
    updatePillbar(); renderFight(); finishPlayerTurn();
  } else if(k==='focus'){
    if(!infAP() && fight.ap>=getMaxAP()){ logf(`<span class="info">Your Action Points are already full.</span>`); renderFight(); return; }
    game.consumables.focus--;
    if(!infAP()) fight.ap = Math.min(getMaxAP(), fight.ap+3);
    sfxHeal();
    logf(`<span class="special">⚗️ Focus Tonic — +3 Action Points.</span>`);
    renderFight();
  }
}
function onPlayerHitTaken(dmg){
  if(dmg>0 && activeSetPieces()==='ashwalker') fight.ashwalkerStacks = (fight.ashwalkerStacks||0)+1;
}

function resolveEnemyTurn(){
  if(!fight) return;
  // tick zones
  fight.targets.forEach(t=>{
    if(t.hp<=0) return;
    const zs = fight.zones[t.id]||[];
    zs.forEach(z=>{
      if(z.rounds>0){
        const dmg = Math.max(3, Math.floor(t.maxHp*0.035));
        dealDamage(t, dmg);
        if(t.hp>0) logf(`<span class="dmg">${ELEMENTS[z.el].icon} ${t.name} burns for ${dmg}.</span>`);
        z.rounds--;
      }
    });
    fight.zones[t.id] = zs.filter(z=>z.rounds>0);
  });
  fight.guardCounterPct = activeSetPieces()==='bulwark' ? 0.4 : 0;
  const buffMult = buffMultiplier();

  aliveTargets().forEach(t=>{
    if(t.heals && Math.random()<0.15){
      const core = fight.targets.find(c=>c.isCore);
      if(core && core.hp>0 && core.hp<core.maxHp){
        const healAmt = Math.floor(t.maxHp*0.18);
        core.hp = Math.min(core.maxHp, core.hp+healAmt);
        logf(`<span class="heal">💚 ${t.name} channels strength into the Core — +${healAmt} HP.</span>`);
        rollTelegraph(t);
        return;
      }
    }
    // Segments are meaningful objectives (their shield/buffer/heal effects on the Core apply
    // regardless), but only the Core itself lands direct attacks — stacking every segment as
    // an additional simultaneous melee threat made every multi-segment boss unwinnable in
    // practice, independent of individual stat tuning. See the Update Log for the full story.
    if(isBossLike(fight.opts.kind) && !t.isCore){
      // Segments that are plain fighters (claws, fins, blades) land weak chip hits; shields/buffers just do their job.
      if(effectiveRole(t)==='plain' && t.atk>0 && !game.sandbox.godMode){
        let chip = Math.max(2, Math.floor(t.atk*0.4) - getTotalDef() + Math.floor(Math.random()*4));
        if(fight.guardActive) chip = Math.floor(chip*0.5);
        chip = Math.max(1, Math.floor(chip*Math.max(0.15, 1+effectMods('dmgTakenPct'))*curStance().dmgTakenMult));
        game.hp = Math.max(0, game.hp-chip);
        logf(`<span class="dmg">⚔️ ${t.name} chips at you for ${chip}.</span>`);
      }
      return;
    }
    let baseAtk = t.isCore ? Math.floor(t.atk*buffMult) : t.atk;
    if(t.traits && t.traits.includes('Berserking') && t.hp < t.maxHp*0.5) baseAtk = Math.floor(baseAtk*1.35);
    let dmg = Math.max(2, baseAtk - getTotalDef() + Math.floor(Math.random()*6));
    let note = '';
    if(t.chilled){ dmg = Math.floor(dmg*0.8); t.chilled=false; note += ' (chilled)'; }
    if(t.traits && t.traits.includes('Vicious')) dmg = Math.floor(dmg*1.25);
    if(inCorruptionZone() && game.corruption>0) dmg += Math.floor(dmg*(game.corruption/MAX_CORRUPTION)*0.15);
    if(fight.opts.kind==='gauntlet' && fight.opts.mutators && fight.opts.mutators.glassCannon) dmg = Math.floor(dmg*1.5);
    if(fight.opts.kind==='gauntlet' && fight.opts.mutators && fight.opts.mutators.fastClock) dmg += (game.gauntletWave||1)-1;
    if(game.hp < game.maxHp*0.3){
      dmg = Math.floor(dmg*1.12);
      if(!fight.lowHpWarned){ fight.lowHpWarned = true; logf(`<span class="dmg">🩸 It smells blood — it's hitting harder while you're low.</span>`); }
    }
    if(fight.punishThisRound) dmg = Math.floor(dmg*1.25);

    if(t.telegraph==='heavy'){
      dmg = Math.floor(dmg*2.1);
      if(fight.guardActive){ dmg = Math.floor(dmg*0.35); note += ' (guarded)'; }
      logf(`<span class="dmg">⚠️ ${t.name} lands a heavy strike for ${dmg}${note}.</span>`);
      shakeScreen(!fight.guardActive);
    } else if(t.telegraph==='drain'){
      if(fight.guardActive){ dmg = Math.floor(dmg*0.5); note += ' (guarded)'; }
      const heal = Math.floor(dmg*0.4);
      t.hp = Math.min(t.maxHp, t.hp+heal);
      logf(`<span class="dmg">🩸 ${t.name} drains ${dmg}${note}, healing ${heal}.</span>`);
    } else {
      if(fight.guardActive){ dmg = Math.floor(dmg*0.5); note += ' (guarded)'; }
      logf(`<span class="dmg">⚔️ ${t.name} hits for ${dmg}${note}.</span>`);
    }
    if(t.traits && t.traits.includes('Swift') && Math.random()<0.25){
      const extra = Math.floor(dmg*0.5);
      dmg += extra;
      logf(`<span class="dmg">💨 It strikes again — an extra ${extra}.</span>`);
    }
    if(fight.guardActive && fight.guardCounterPct>0){
      const counter = Math.floor(dmg*fight.guardCounterPct);
      if(counter>0 && t.hp>0){ dealDamage(t, counter); logf(`<span class="special">🛡 Bulwark's Answer counters for ${counter}.</span>`); }
    }
    if(!game.sandbox.godMode){
      let dmgTakenMult = Math.max(0.15, 1 + effectMods('dmgTakenPct'));
      if(activeSetPieces()==='corruptor' && inCorruptionZone() && game.corruption>=50) dmgTakenMult *= 0.9;
      dmgTakenMult *= curStance().dmgTakenMult;
      dmg = Math.floor(dmg * dmgTakenMult);
      game.hp = Math.max(0, game.hp-dmg);
      onPlayerHitTaken(dmg);
      if(dmg>0 && t.traits && t.traits.includes('Sapping') && !infAP() && fight.ap>0){
        fight.ap--; logf(`<span class="dmg">🪫 The hit saps 1 Action Point.</span>`);
      }
      if(dmg>0 && t.traits && t.traits.includes('Bleeding') && Math.random()<0.4){
        fight.bleed = {rounds:3, per:Math.max(2, Math.floor(game.maxHp*0.02))};
        logf(`<span class="dmg">🗡️ The wound keeps bleeding.</span>`);
      }
      if(inInfectionZone() && dmg>0 && fight.infectionStacks<MAX_INFECTION){
        const infectChance = Math.max(0, 0.45 - effectMods('infectionResist'));
        if(Math.random()<infectChance){
          fight.infectionStacks++;
          logf(`<span class="special" style="color:#8fe36b;">🦠 The hit leaves something behind — Infection ${fight.infectionStacks}/${MAX_INFECTION}.</span>`);
        }
      }
    }
    if(t.traits && t.traits.includes('Vampiric')){
      t.hp = Math.min(t.maxHp, t.hp+Math.floor(dmg*0.3));
    }
    if(t.traits && t.traits.includes('Regenerating') && t.hp<t.maxHp*0.5 && Math.random()<0.3){
      const heal = Math.floor(t.maxHp*0.1);
      t.hp = Math.min(t.maxHp, t.hp+heal);
      logf(`<span class="heal">💚 ${t.name} regenerates ${heal}.</span>`);
    }
    rollTelegraph(t);
  });

  fight.targets.forEach(t=>{ if(t.role==='phase' && t.hp>0) t.phaseIdx = (t.phaseIdx||0)+1; });
  if(inInfectionZone() && fight.infectionStacks>0 && game.hp>0 && !game.sandbox.godMode){
    const infDmg = Math.max(2, Math.floor(game.maxHp*0.03*fight.infectionStacks));
    game.hp = Math.max(0, game.hp-infDmg);
    logf(`<span class="dmg">🦠 Infection festers — you take ${infDmg}.</span>`);
  }
  if(fight.bleed && fight.bleed.rounds>0 && game.hp>0 && !game.sandbox.godMode){
    game.hp = Math.max(0, game.hp-fight.bleed.per);
    logf(`<span class="dmg">🗡️ You bleed for ${fight.bleed.per}.</span>`);
    fight.bleed.rounds--;
    if(fight.bleed.rounds<=0) fight.bleed = null;
  }
  fight.guardActive = false;
  fight.punishThisRound = false;
  if(fight.abilityCd>0) fight.abilityCd--;
  game.effects.forEach(e=>{ if(typeof e.roundsLeft==='number') e.roundsLeft--; });
  game.effects = game.effects.filter(e=> !(typeof e.roundsLeft==='number' && e.roundsLeft<=0));
  fight.round++;
  updatePillbar();
  renderFight();
}

function sandboxForceKillSegment(){
  const t = selectedTarget();
  if(t){ dealDamage(t, t.hp); handleTraitOnDeath(t); renderFight(); }
}
function sandboxToggleGod(){ game.sandbox.godMode=!game.sandbox.godMode; renderFight(); }

function fightVictory(){
  const opts = fight.opts;

  if(opts.chainToBoss){
    render(`
      <div class="panel" style="text-align:center;">
        <h2 style="color:var(--good); margin-bottom:10px;">⭐ Champion Down</h2>
        <p style="color:var(--dim);">No rest. The next boss is already moving.</p>
        <div class="btnrow" style="justify-content:center; margin-top:14px;"><button class="primary" onclick="bossRushPhase2()">Continue →</button></div>
      </div>
    `);
    fight = null;
    return;
  }

  if(opts.kind==='rival'){
    const cfg = opts.rivalConfig;
    const firstClear = !game.arenaCleared[cfg.key];
    game.arenaCleared[cfg.key] = true;
    const rxp = Math.floor(cfg.xp*(firstClear?1:0.4)), rgold = Math.floor(cfg.gold*(firstClear?1:0.4));
    game.xp += rxp; game.gold += rgold;
    let gearNote = '';
    if(firstClear && cfg.finalRank){
      addToInventory('weapon', "Corruptor's Fang"); addToInventory('armor', "Corruptor's Husk");
      gearNote = `<p style="color:var(--good); margin-top:8px;">Obtained: Corruptor's Fang &amp; Corruptor's Husk</p>`;
    }
    checkLevelUps();
    game.effects = game.effects.filter(e=>e.duration==='permanent');
    render(`
      <div class="panel" style="text-align:center;">
        <h2 style="color:var(--gold); margin-bottom:12px;">🗡️ ${cfg.name} Defeated</h2>
        <p style="color:var(--dim); font-style:italic; margin-bottom:14px;">${cfg.defeatLine}</p>
        <p>+${rxp} XP · +${rgold} Gold${firstClear?'':' (rematch: 40%)'}</p>
        ${gearNote}
        ${firstClear && !cfg.finalRank ? `<p class="segnote" style="margin-top:8px;">The next rank of the Arena is open.</p>` : ''}
        <div class="btnrow" style="justify-content:center; margin-top:16px;"><button class="primary" onclick="screenHub()">Continue →</button></div>
      </div>
    `);
    fight = null;
    return;
  }

  if(opts.kind==='superboss'){
    const cfg = opts.bossConfig;
    game.effects = game.effects.filter(e=>e.duration==='permanent');
    if(opts.sandbox){
      render(`<div class="panel" style="text-align:center;"><h2 style="color:var(--voidc);">👁️ ${cfg.name} Defeated</h2><p style="color:var(--dim);">Sandbox fight — no rewards recorded.</p><div class="btnrow" style="justify-content:center; margin-top:12px;"><button class="primary" onclick="openTrials()">← Back to Trials</button></div></div>`);
      fight = null;
      return;
    }
    const firstClear = !game.superbossesCleared[cfg.key];
    game.superbossesCleared[cfg.key] = true;
    const sxp = Math.floor(cfg.xp*(firstClear?1:0.5)), sgold = Math.floor(cfg.gold*(firstClear?1:0.5));
    game.xp += sxp; game.gold += sgold;
    checkLevelUps();
    render(`
      <div class="panel" style="text-align:center;">
        <h2 style="color:var(--voidc); margin-bottom:12px;">👁️ ${cfg.name} Falls</h2>
        <p style="color:var(--dim); font-style:italic; margin-bottom:14px;">${cfg.defeatLine}</p>
        <p>+${sxp} XP · +${sgold} Gold</p>
        ${firstClear ? `<p class="segnote" style="margin-top:8px;">Rank ${cfg.rank} of the Ascendant Ladder is done.${SUPERBOSSES[cfg.rank] ? ' The next rank is open.' : ' There is nothing higher — for now.'}</p>` : ''}
        <div class="btnrow" style="justify-content:center; margin-top:16px;"><button class="primary" onclick="screenHub()">Continue →</button></div>
      </div>
    `);
    fight = null;
    return;
  }

  if(opts.kind==='boss'){
    const cfg = opts.bossConfig;
    game.effects = game.effects.filter(e=>e.duration==='permanent');
    if(opts.sandbox){
      render(`<div class="panel" style="text-align:center;"><h2 style="color:var(--good);">🏆 ${cfg.name} Defeated</h2><p style="color:var(--dim);">Sandbox fight — no rewards recorded.</p><div class="btnrow" style="justify-content:center; margin-top:12px;"><button class="primary" onclick="openTrials()">← Back to Trials</button></div></div>`);
      fight = null;
      return;
    }
    const rm = opts.replay ? 0.4 : 1;
    const bxp = Math.floor(cfg.xp*rm), bgold = Math.floor(cfg.gold*rm);
    game.xp += bxp; game.gold += bgold;
    addToInventory('weapon', cfg.reward.weapon); addToInventory('armor', cfg.reward.armor);
    game.dungeonsCleared[cfg.chapter-1] = true;
    checkLevelUps();
    if(opts.mapReplay){
      render(`
        <div class="panel" style="text-align:center;">
          <h2 style="color:var(--gold); margin-bottom:12px;">🏆 ${cfg.name} Falls Again</h2>
          <p style="color:var(--dim); font-style:italic; margin-bottom:14px;">${cfg.defeatLine}</p>
          <p>+${bxp} XP · +${bgold} Gold</p>
          <div class="btnrow" style="justify-content:center; margin-top:16px;"><button class="primary" onclick="openWorldMap()">← Back to World Map</button></div>
        </div>
      `);
      fight = null;
      return;
    }
    const isFinale = !!cfg.finale;
    const isWorldEnd = !!cfg.worldEnd;
    render(`
      <div class="panel" style="text-align:center;">
        <h2 style="color:var(--gold); margin-bottom:12px;">🏆 ${cfg.name} Falls</h2>
        <p style="color:var(--dim); font-style:italic; margin-bottom:14px;">${cfg.defeatLine}</p>
        <p>+${bxp} XP · +${bgold} Gold${opts.replay?' (replay: 40%)':''}</p>
        <p style="color:var(--good); margin-top:8px;">Obtained: ${cfg.reward.weapon} &amp; ${cfg.reward.armor}</p>
        ${isWorldEnd ? `<p class="segnote" style="margin-top:10px;">${cfg.worldEndNote || (`World ${cfg.worldEnd} is done — but the fracture wasn't finished. Something else grew through it.`)}</p>` : ''}
        <div class="btnrow" style="justify-content:center; margin-top:16px;">
          ${isFinale ? `<button class="primary" onclick="showCampaignComplete()">View Campaign Summary →</button>`
            : isWorldEnd ? `<button class="primary" onclick="advanceChapter()">World ${cfg.worldEnd} Complete — Descend Into World ${cfg.worldEnd+1} →</button>`
            : `<button class="primary" onclick="advanceChapter()">Proceed to Chapter ${game.chapter+1}: ${(CHAPTER_TITLES[game.chapter]||{}).name||''} →</button>`}
        </div>
      </div>
    `);
    fight = null;
    return;
  }

  if(opts.kind==='gauntlet'){
    const t = fight.targets[0];
    game.xp += t.xp; game.gold += t.gold; checkLevelUps();
    if(game.gauntletWave > game.bestGauntletWave) game.bestGauntletWave = game.gauntletWave;
    game.effects = game.effects.filter(e=>e.duration==='permanent');
    render(`
      <div class="panel" style="text-align:center;">
        <h2 style="color:var(--good); margin-bottom:10px;">⚔️ Wave ${game.gauntletWave} Cleared</h2>
        <p>+${t.xp} XP · +${t.gold} Gold</p>
        <p class="segnote" style="margin-top:6px;">🏆 Best Wave: ${game.bestGauntletWave}</p>
        <div class="btnrow" style="justify-content:center; margin-top:14px;">
          <button class="primary" onclick="startGauntletWave(game.gauntletWave+1)">⚔️ Face Wave ${game.gauntletWave+1}</button>
          <button onclick="screenHub()">🏳️ Retreat (Keep Rewards)</button>
        </div>
      </div>
    `);
    fight = null;
    return;
  }

  // regular / champion
  let xp=0, gold=0, dropLore=false, dropShard=false;
  if(opts.kind==='regular'){ xp=fight.targets.reduce((n,t)=>n+t.xp,0); gold=fight.targets.reduce((n,t)=>n+t.gold,0); dropLore = Math.random()<0.4 || !!opts.elite; if(opts.elite && Math.random()<0.5) dropShard = true; }
  if(opts.kind==='champion'){ const t=fight.targets[0]; xp=t.xp; gold=t.gold; dropShard=true; if(!opts.sandbox) game.championDefeated=true; }

  const drops = [];
  if(!opts.sandbox){
    gold = Math.floor(gold*moraleGoldMult());
    game.xp+=xp; game.gold+=gold;
    if(dropLore){ game.loreFragments++; unlockNextLore(); }
    if(dropShard) game.voidShards++;
    rollDrops(opts, drops);
    checkLevelUps();
  }
  game.effects = game.effects.filter(e=>e.duration==='permanent');
  const heading = opts.kind==='champion' ? '⭐ CHAMPION DEFEATED' : (opts.elite ? '✨ ELITE DEFEATED' : '⚔️ VICTORY');

  render(`
    <div class="panel" style="text-align:center;">
      <h2 style="color:${opts.elite?'var(--gold)':'var(--good)'}; margin-bottom:14px;">${heading}</h2>
      ${!opts.sandbox ? `<div class="loot-reveal" style="border-color:${opts.elite?'var(--gold)':'var(--line)'}; background:${opts.elite?'linear-gradient(135deg, rgba(255,207,92,.12), rgba(255,207,92,.03))':'transparent'};">+${xp} XP &nbsp;·&nbsp; +${gold} Gold${dropLore?' · +1 Lore Fragment':''}${dropShard?' · +1 Void Shard':''}${drops.map(d=>' · '+d).join('')}</div>` : `<p style="color:var(--dim);">Sandbox fight — no rewards recorded.</p>`}
      <div class="btnrow" style="justify-content:center; margin-top:14px;">
        ${opts.sandbox ? `<button class="primary" onclick="openTrials()">← Back to Trials</button>` : `<button class="primary" onclick="screenHub()">Continue →</button>`}
      </div>
    </div>
  `);
  fight = null;
}
function moraleGoldMult(){ return game.morale<=-3 ? 1.1 : 1; }
function restRate(){ return game.morale>=3 ? 0.75 : 1; }
function randomGearDrop(){
  const ch = game.chapter, pool = [];
  Object.keys(WEAPONS).forEach(n=>{ const w=WEAPONS[n];
    if(!w.setKey && ['uncommon','rare','epic'].includes(w.rarity) && w.atk<=10+ch*4 && w.atk>=ch*3 && !game.inventory.weapons.includes(n)) pool.push({type:'weapon',name:n}); });
  Object.keys(ARMOR).forEach(n=>{ const a=ARMOR[n];
    if(!a.setKey && ['uncommon','rare','epic'].includes(a.rarity) && a.def<=8+ch*3 && a.def>=ch*2 && !game.inventory.armor.includes(n)) pool.push({type:'armor',name:n}); });
  return pool.length ? pool[Math.floor(Math.random()*pool.length)] : null;
}
function rollDrops(opts, drops){
  const special = !!opts.elite || opts.kind==='champion';
  const potChance = opts.elite ? 1 : (opts.kind==='champion' ? 0.5 : 0.15);
  if(Math.random() < potChance){
    const k = Math.random()<0.6 ? 'heal' : 'focus';
    if(game.consumables[k] < MAX_CONSUMABLE){ game.consumables[k]++; drops.push(`+1 ${CONSUMABLES[k].name}`); }
  }
  if(special && Math.random() < 0.25){
    const item = randomGearDrop();
    if(item){ addToInventory(item.type, item.name); drops.push(`Found: ${item.name}`); }
  }
}
function checkLevelUps(){
  let leveled=false, newLevel=game.level;
  while(game.xp>=game.xpNeeded){
    game.level++; game.xp-=game.xpNeeded; game.xpNeeded=Math.floor(game.xpNeeded*1.35);
    game.maxHp+=18; game.baseAtk+=1; if(game.level%3===0) game.baseDef+=1; game.hp=game.maxHp; leveled=true; newLevel=game.level;
  }
  if(leveled){
    sfxLevelUp();
    showLevelUpBanner(newLevel);
  }
}
function showLevelUpBanner(level){
  try{
    const el = document.createElement('div');
    el.className = 'levelup-banner';
    el.innerHTML = `<div class="lu-title">LEVEL ${level}</div><div class="lu-sub">+18 HP · +1 Attack${level%3===0?' · +1 Defense':''}</div>`;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 2100);
  }catch(e){}
}
function ascendNewGamePlus(){

}

function fightDefeat(){
  sfxDefeat();
  const wasGauntlet = fight && fight.opts && fight.opts.kind==='gauntlet';
  if(wasGauntlet && game.gauntletWave > game.bestGauntletWave) game.bestGauntletWave = game.gauntletWave;
  const wasSandbox = !!(fight && fight.opts && fight.opts.sandbox);
  let goldLost = 0;
  if(!wasGauntlet && !wasSandbox){ goldLost = Math.floor(game.gold*0.12); game.gold -= goldLost; updatePillbar(); }
  render(`
    <div class="panel" style="text-align:center;">
      <h2 style="color:var(--bad); margin-bottom:14px;">💀 DEFEAT</h2>
      <p style="color:var(--dim); margin-bottom:14px;">${wasGauntlet ? `The Gauntlet ends. You fell on Wave ${game.gauntletWave}. 🏆 Best Wave: ${game.bestGauntletWave}.` : `The fracture doesn't forgive carelessness. You're pulled back to the surface, battered but breathing.${goldLost>0?` You lose ${goldLost} gold in the scramble.`:''}`}</p>
      <div class="btnrow" style="justify-content:center;"><button class="primary" onclick="recoverFromDefeat()">Return to the Hub</button></div>
    </div>
  `);
  fight = null;
}
function recoverFromDefeat(){
  game.hp = Math.max(1, Math.floor(game.maxHp*0.4));
  game.effects = game.effects.filter(e=>e.duration==='permanent');
  screenHub();
}

   World Map — revisit any previously-reached chapter and replay its boss
========================================================= */
function openWorldMap(){
  const worlds = {};
  CHAPTER_TITLES.forEach((ch,i)=>{ (worlds[ch.world]=worlds[ch.world]||[]).push({idx:i, ch}); });
  const worldPanels = Object.keys(worlds).sort((a,b)=>a-b).map(w=>{
    const nodes = worlds[w].map(({idx,ch})=>{
      const chapterNum = idx+1;
      const reached = chapterNum <= game.chapter || game.dungeonsCleared[idx];
      const cleared = game.dungeonsCleared[idx];
      const isCurrent = chapterNum === game.chapter && !cleared;
      const boss = BOSSES_LIST[idx];
      let statusIcon = '🔒', statusColor = 'var(--dim)';
      if(cleared){ statusIcon='✅'; statusColor='var(--good)'; }
      else if(isCurrent){ statusIcon='📍'; statusColor='var(--gold)'; }
      else if(reached){ statusIcon='⏳'; statusColor='var(--dim)'; }
      return `<div class="panel" style="margin-bottom:8px; ${reached?'':'opacity:.45;'}">
        <div class="statline"><strong style="color:${statusColor};">${statusIcon} Chapter ${chapterNum} — ${ch.name}</strong></div>
        <p class="segnote" style="font-style:italic;">${ch.subtitle}</p>
        ${cleared ? `<p class="segnote">Boss: ${boss.name}</p><button class="small" onclick="closeModal(); mapReplayBoss(${idx})">⚔️ Replay Boss</button>`
          : reached ? `<p class="segnote">Not yet cleared — descend from the Hub to continue.</p>`
          : `<p class="segnote">Not yet reached.</p>`}
      </div>`;
    }).join('');
    return `<div class="eyebrow" style="margin-top:10px;">World ${w}</div>${nodes}`;
  }).join('');
  showModal(`
    <h2 style="color:var(--ap); text-align:center; margin-bottom:6px;">🗺️ World Map</h2>
    <p class="segnote" style="text-align:center; margin-bottom:10px;">Replaying a boss grants its usual rewards again (gear you already own just won't duplicate) without touching your current progress.</p>
    ${worldPanels}
    <div class="btnrow" style="justify-content:center; margin-top:10px;"><button onclick="closeModal()">Close</button></div>
  `);
}
function mapReplayBoss(chapterIdx){
  const cfg = BOSSES_LIST[chapterIdx];
  if(!cfg || !game.dungeonsCleared[chapterIdx]) return;
  const hpMult = 1.3*diffMult()*ngMult(), dmgMult = 1.2*diffMult()*ngMult();
  launchBossFight(cfg, hpMult, dmgMult, {replay:true, mapReplay:true});
}

/* =========================================================
   Save / Load
========================================================= */
function saveGame(){
  game.hasUnsavedProgress = false;
  const blob = new Blob([JSON.stringify(game,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=`vc2-save-${(game.name||'adventurer').replace(/[^a-z0-9]/gi,'_')}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}
function loadGame(evt){
  const file = evt.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      game = migrateSave(data);
      fight = null;
      applyDisplaySettings();
      updatePillbar();
      screenHub();
    }catch(err){
      showModal(`<p style="text-align:center; color:var(--bad);">That file doesn't look like a valid save.</p><div class="btnrow" style="justify-content:center; margin-top:10px;"><button onclick="closeModal()">Close</button></div>`);
    }
  };
  reader.readAsText(file);
  evt.target.value='';
}
document.addEventListener('keydown', e=>{
  if(!fight || e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.target && (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA')) return;
  if(document.getElementById('modal-overlay').classList.contains('active')) return;
  const keys = {'1':doAttack, '2':doPower, '3':doGuard, '4':doAbility, '5':doUnleash};
  const fn = keys[e.key];
  if(fn){ e.preventDefault(); fn(); }
});
window.addEventListener('beforeunload', e=>{
  if(game.hasUnsavedProgress){ e.preventDefault(); e.returnValue=''; }
});

/* =========================================================
   Boot
========================================================= */
if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches){
  game.settings.reduceMotion = true;
  document.body.classList.add('reduce-motion');
}
screenStart();
</script>
