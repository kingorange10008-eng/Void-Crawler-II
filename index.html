<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOID CRAWLER II — Fractures</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
  :root{
    --bg0:#05060c; --bg1:#0a0c18; --bg2:#0f1226;
    --panel:rgba(20,22,42,.55); --panel-solid:#12142a; --line:rgba(148,163,255,.14); --line-soft:rgba(148,163,255,.08);
    --ink:#eef0fb; --dim:#9398c4;
    --ap:#67d6ff; --ap2:#b18aff;
    --hp:#ff4d6a; --hpsoft:#ff96ab;
    --gold:#ffcf5c;
    --fire:#ff9d54; --frost:#69dcf4; --voidc:#d68bff;
    --good:#4ee6a0; --bad:#ff6b7d;
    --r-common:#a3a8cf; --r-uncommon:#4ee6a0; --r-rare:#5fb0ff; --r-epic:#c07dff; --r-legendary:#ffcf5c; --r-mythic:#ff5f8f; --r-primordial:#7dfff0; --r-apex:#ff3d3d;
    --radius:16px; --radius-sm:11px;
    --font-ui:'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --font-mono:'JetBrains Mono', 'Courier New', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  ::selection{background:rgba(103,214,255,.3); color:#fff;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(148,163,255,.25); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(148,163,255,.4);}

  body{
    font-family:var(--font-ui); font-size:15px; -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 900px 500px at 15% -8%, rgba(103,90,220,.28) 0%, transparent 60%),
      radial-gradient(ellipse 900px 600px at 95% 105%, rgba(30,150,220,.22) 0%, transparent 55%),
      radial-gradient(ellipse 700px 500px at 50% 40%, rgba(120,60,200,.08) 0%, transparent 60%),
      linear-gradient(165deg, var(--bg0), var(--bg1) 45%, var(--bg2));
    background-attachment:fixed;
    color:var(--ink); min-height:100vh; display:flex; justify-content:center;
    padding:20px;
  }
  body.large-text{font-size:18px;}
  body.reduce-motion *, body.reduce-motion *::before, body.reduce-motion *::after{
    animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;
  }
  .wrap{max-width:940px; width:100%;}
  .shell{
    background:linear-gradient(180deg, rgba(22,24,46,.72), rgba(10,11,22,.82));
    backdrop-filter:blur(28px) saturate(140%); -webkit-backdrop-filter:blur(28px) saturate(140%);
    border:1px solid var(--line); border-radius:24px; padding:28px;
    box-shadow:0 40px 90px rgba(0,0,0,.5), 0 1px 0 rgba(255,255,255,.06) inset, 0 0 0 1px rgba(103,214,255,.03) inset;
    animation:shellIn .4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes shellIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  h1.title{
    text-align:center; font-size:2.05em; letter-spacing:.02em; font-weight:800; font-family:var(--font-ui);
    background:linear-gradient(120deg, var(--ap), var(--ap2) 55%, var(--voidc));
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    margin-bottom:2px; filter:drop-shadow(0 0 24px rgba(103,214,255,.25));
  }
  .subtitle{text-align:center; color:var(--dim); font-size:.78em; letter-spacing:.28em; margin-bottom:20px; text-transform:uppercase; font-weight:600;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .col{display:flex; flex-direction:column; gap:12px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
  @media (max-width:640px){ .grid2,.grid3{grid-template-columns:1fr;} body{padding:10px;} .shell{padding:18px; border-radius:18px;} }

  .panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:16px;
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
    transition:border-color .2s ease;
  }
  .eyebrow{font-size:.7em; letter-spacing:.16em; text-transform:uppercase; color:var(--dim); margin-bottom:9px; font-weight:700;}
  .hint{border:1px solid rgba(177,138,255,.35); border-radius:var(--radius-sm); padding:13px 14px; background:linear-gradient(135deg, rgba(177,138,255,.1), rgba(103,214,255,.05)); font-size:.85em; line-height:1.65; color:#e6e0ff; margin-top:10px;}

  button{
    background:linear-gradient(180deg, rgba(38,41,72,.9), rgba(18,20,38,.9)); color:var(--ink);
    border:1px solid rgba(148,163,255,.18); border-radius:12px; padding:11px 15px; font-family:var(--font-ui);
    font-weight:600; font-size:.9em; cursor:pointer; text-align:left;
    transition:transform .16s cubic-bezier(.2,.8,.2,1), box-shadow .16s ease, border-color .16s ease, background .16s ease;
    position:relative;
  }
  button:hover:not(:disabled){border-color:var(--ap); transform:translateY(-1.5px); box-shadow:0 10px 24px rgba(103,214,255,.16); background:linear-gradient(180deg, rgba(48,52,90,.95), rgba(22,24,44,.95));}
  button:active:not(:disabled){transform:translateY(0); box-shadow:0 4px 10px rgba(103,214,255,.12);}
  button:disabled{opacity:.32; cursor:not-allowed;}
  button:focus-visible{outline:2px solid var(--ap); outline-offset:2px;}
  button.primary{border-color:rgba(103,214,255,.5); background:linear-gradient(135deg, rgba(103,214,255,.18), rgba(177,138,255,.14)); box-shadow:0 4px 18px rgba(103,214,255,.1);}
  button.primary:hover:not(:disabled){box-shadow:0 12px 28px rgba(103,214,255,.28);}
  button.danger{border-color:rgba(255,107,125,.5); background:linear-gradient(135deg, rgba(255,107,125,.14), rgba(255,77,106,.08));}
  button.ghost{background:transparent; border-color:var(--line-soft);}
  button.small{padding:7px 11px; font-size:.8em; border-radius:9px;}
  .btnrow{display:flex; flex-wrap:wrap; gap:9px; margin-top:9px;}

  .barbg{height:11px; border-radius:99px; background:rgba(0,0,0,.45); border:1px solid rgba(255,255,255,.08); overflow:hidden; position:relative;}
  .barfill{height:100%; border-radius:99px; transition:width .45s cubic-bezier(.2,.8,.2,1); position:relative;}
  .barfill::after{content:''; position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,255,255,.25), transparent 60%);}
  .hpfill{background:linear-gradient(90deg,#9c1f37,var(--hp),#c23350);}
  .hpfill.critical{animation:critPulse 1s ease-in-out infinite;}
  @keyframes critPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.6);}}
  .xpfill{background:linear-gradient(90deg, var(--ap2), var(--ap));}

  .ap-track{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .ap-pip{width:17px; height:17px; border-radius:5px; transform:rotate(45deg); background:rgba(255,255,255,.04); border:1px solid rgba(148,163,255,.25); transition:all .2s ease;}
  .ap-pip.full{background:linear-gradient(135deg,var(--ap),var(--ap2)); box-shadow:0 0 10px rgba(103,214,255,.55); border-color:transparent;}

  .target-card{cursor:pointer; padding:12px; border-radius:var(--radius-sm); border:1.5px solid var(--line); background:rgba(10,11,24,.5); min-width:132px; flex:1; transition:all .18s ease;}
  .target-card:hover:not(.dead){border-color:rgba(103,214,255,.35); transform:translateY(-1px);}
  .target-card.sel{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 8px 20px rgba(255,207,92,.18); background:rgba(255,207,92,.05);}
  .target-card.dead{opacity:.32; text-decoration:line-through; cursor:default;}
  .target-name{font-size:.85em; font-weight:700; margin-bottom:6px;}
  .zone-tag{display:inline-block; font-size:.66em; padding:2px 7px; border-radius:99px; margin-right:4px; margin-top:5px; font-weight:600;}
  .zone-fire{background:rgba(255,157,84,.16); color:var(--fire); border:1px solid rgba(255,157,84,.35);}
  .zone-frost{background:rgba(105,220,244,.16); color:var(--frost); border:1px solid rgba(105,220,244,.35);}
  .zone-void{background:rgba(214,139,255,.16); color:var(--voidc); border:1px solid rgba(214,139,255,.35);}

  .telegraph{border-radius:var(--radius-sm); padding:9px 11px; text-align:center; font-size:.78em; margin-top:7px; border:1px solid; font-weight:600;}
  .tg-heavy{border-color:var(--hp); background:rgba(255,77,106,.12); color:#ffb0ba;}
  .tg-drain{border-color:var(--voidc); background:rgba(214,139,255,.12); color:#eccbff;}

  .log{max-height:150px; overflow-y:auto; background:rgba(0,0,0,.5); border:1px solid var(--line); border-radius:var(--radius-sm); padding:11px 12px; font-size:.82em; line-height:1.6; margin:11px 0; font-family:var(--font-mono);}
  .log div{padding:2px 0; border-bottom:1px solid rgba(255,255,255,.05);}
  .dmg{color:var(--hpsoft);} .crit{color:var(--gold); font-weight:700;} .heal{color:var(--good);}
  .info{color:var(--dim); font-style:italic;} .special{color:var(--ap2);}

  .rarity-common{color:var(--r-common);} .rarity-uncommon{color:var(--r-uncommon);}
  .rarity-rare{color:var(--r-rare);} .rarity-epic{color:var(--r-epic);}
  .rarity-legendary{color:var(--r-legendary);} .rarity-mythic{color:var(--r-mythic); text-shadow:0 0 10px rgba(255,95,143,.5);}
  .rarity-primordial{color:var(--r-primordial); text-shadow:0 0 10px rgba(125,255,240,.55);}
  .rarity-apex{color:var(--r-apex); text-shadow:0 0 12px rgba(255,61,61,.6);}

  .statline{display:flex; justify-content:space-between; font-size:.85em; padding:6px 0; border-bottom:1px solid var(--line-soft); font-family:var(--font-mono);}
  .pillbar{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; font-size:.8em; color:var(--dim); margin-bottom:16px; font-family:var(--font-mono);}
  .pillbar span{background:rgba(255,255,255,.03); border:1px solid var(--line-soft); padding:4px 10px; border-radius:99px;}
  .pillbar strong{color:var(--ink); font-weight:700;}

  .modal-overlay{display:none; position:fixed; inset:0; background:rgba(4,5,12,.72); backdrop-filter:blur(6px); z-index:50; align-items:center; justify-content:center; padding:16px;}
  .modal-overlay.active{display:flex; animation:fadeInOverlay .18s ease;}
  @keyframes fadeInOverlay{ from{opacity:0;} to{opacity:1;} }
  .modal{
    background:linear-gradient(180deg, rgba(24,26,48,.92), rgba(10,11,22,.96));
    backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px);
    border:1px solid rgba(177,138,255,.3); border-radius:20px; padding:24px; max-width:640px; width:100%; max-height:85vh; overflow-y:auto;
    box-shadow:0 30px 80px rgba(0,0,0,.6); animation:modalIn .22s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes modalIn{ from{opacity:0; transform:translateY(10px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }

  .floaty{position:fixed; pointer-events:none; font-weight:800; font-size:1.3em; z-index:99; animation:floatUp 1s ease-out forwards; left:50%; top:38%; font-family:var(--font-mono);}
  @keyframes floatUp{0%{opacity:1; transform:translate(-50%,0) scale(1);}15%{transform:translate(-50%,-6px) scale(1.15);}100%{opacity:0; transform:translate(-50%,-70px) scale(1);}}
  .fl-crit{animation:floatUpBig 1.05s ease-out forwards !important;}
  @keyframes floatUpBig{0%{opacity:1; transform:translate(-50%,0) scale(0.6) rotate(-4deg);}20%{transform:translate(-50%,-10px) scale(1.35) rotate(2deg);}100%{opacity:0; transform:translate(-50%,-80px) scale(1.1) rotate(0deg);}}
  .shake{animation:shakeIt .32s cubic-bezier(.36,.07,.19,.97) both;}
  @keyframes shakeIt{
    10%,90%{transform:translate3d(-1px,0,0);} 20%,80%{transform:translate3d(2px,0,0);}
    30%,50%,70%{transform:translate3d(-4px,0,0);} 40%,60%{transform:translate3d(4px,0,0);}
  }
  .shake-big{animation:shakeItBig .45s cubic-bezier(.36,.07,.19,.97) both;}
  @keyframes shakeItBig{
    10%,90%{transform:translate3d(-2px,0,0);} 20%,80%{transform:translate3d(4px,0,0);}
    30%,50%,70%{transform:translate3d(-7px,0,0);} 40%,60%{transform:translate3d(7px,0,0);}
  }
  .target-card.elite{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold), 0 0 22px rgba(255,207,92,.35); position:relative;}
  .target-card.elite::before{content:'✨ ELITE'; position:absolute; top:-10px; right:8px; font-size:.62em; font-weight:800; letter-spacing:.08em; color:#1a1610; background:linear-gradient(120deg,var(--gold),#ffe6a3); padding:2px 7px; border-radius:99px;}
  .levelup-banner{position:fixed; left:50%; top:22%; transform:translate(-50%,-50%); z-index:120; text-align:center; pointer-events:none; animation:levelUpPop 2.1s ease-out forwards;}
  .levelup-banner .lu-title{font-size:2.1em; font-weight:800; background:linear-gradient(120deg,var(--gold),#fff3d0,var(--gold)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; filter:drop-shadow(0 0 18px rgba(255,207,92,.6)); font-family:var(--font-ui);}
  .levelup-banner .lu-sub{margin-top:4px; color:var(--gold); font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:.8em;}
  @keyframes levelUpPop{0%{opacity:0; transform:translate(-50%,-40%) scale(.7);}12%{opacity:1; transform:translate(-50%,-50%) scale(1.08);}20%{transform:translate(-50%,-50%) scale(1);}78%{opacity:1;}100%{opacity:0; transform:translate(-50%,-58%) scale(1.05);}}
  .loot-reveal{border-radius:var(--radius-sm); padding:14px; margin-top:10px; text-align:center; animation:lootPop .5s cubic-bezier(.2,.8,.2,1) both; border:1.5px solid; }
  @keyframes lootPop{0%{opacity:0; transform:scale(.85) translateY(8px);}100%{opacity:1; transform:scale(1) translateY(0);}}
  .boss-intro{animation:bossIntroIn .5s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes bossIntroIn{0%{opacity:0; transform:scale(.96);}100%{opacity:1; transform:scale(1);}}
  .fl-dmg{color:var(--hpsoft);} .fl-crit{color:var(--gold); font-size:1.6em;} .fl-heal{color:var(--good);}

  .segnote{font-size:.72em; color:var(--dim); margin-top:3px; line-height:1.55;}
  input[type=text]{font-family:var(--font-ui); background:rgba(0,0,0,.4); border:1px solid var(--line); color:var(--ink); border-radius:11px; padding:11px 14px; font-size:1em; width:100%; transition:border-color .15s ease;}
  input[type=text]:focus{outline:none; border-color:var(--ap);}
  input[type=range]{width:100%; accent-color:var(--ap);}
  .toggle{display:flex; align-items:center; justify-content:space-between; padding:9px 12px; background:rgba(0,0,0,.28); border-radius:var(--radius-sm); border:1px solid var(--line);}
  .ach{display:flex; justify-content:space-between; gap:10px; padding:10px 12px; border-radius:var(--radius-sm); margin-bottom:7px; transition:transform .15s ease;}
  .ach.done{background:rgba(78,230,160,.08); border:1px solid rgba(78,230,160,.3);}
  .ach.locked{background:rgba(0,0,0,.2); border:1px solid var(--line); opacity:.55;}
  .lore-entry{padding:12px; border-radius:var(--radius-sm); background:rgba(10,11,24,.5); border:1px solid var(--line); margin-bottom:9px;}
  .hscroll{display:flex; gap:10px; overflow-x:auto; overflow-y:hidden; padding:4px 2px 10px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;}
  .hscroll::-webkit-scrollbar{height:8px;}
  .hcard{flex:0 0 auto; width:200px; scroll-snap-align:start; display:flex; flex-direction:column;}
  .hcard .btnrow{margin-top:auto; padding-top:9px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="shell">
    <h1 class="title">VOID CRAWLER II</h1>
    <div class="subtitle">— Fractures —</div>
    <div class="pillbar" id="pillbar"></div>
    <div id="app"></div>
  </div>
</div>

<div class="modal-overlay" id="modal-overlay"><div class="modal" id="modal"></div></div>

<script>
/* =========================================================
   VOID CRAWLER II — data
========================================================= */
const SAVE_VERSION = 2;
const DIFF = {easy:{name:'Easy',mult:0.75}, normal:{name:'Normal',mult:1}, hard:{name:'Hard',mult:1.25}, brutal:{name:'Brutal',mult:1.5}};

const CLASSES = {
  warrior:{name:'Warrior', icon:'⚔️', desc:'Blunt and reliable. Rally hardens your resolve mid-fight.',
    mods:{atk:12, def:6, maxAP:0},
    ability:{name:'Rally', icon:'📢', cost:2, cd:3, desc:'+9 Attack and -15% damage taken for 3 rounds, and heals 12% max HP.'}},
  rogue:{name:'Rogue', icon:'🗡️', desc:'Every opening is a killing one. Void Step guarantees the next crit.',
    mods:{atk:7, def:5, crit:0.08, maxAP:1},
    ability:{name:'Void Step', icon:'🌀', cost:2, cd:3, desc:'Next hit is a guaranteed critical, refunds 2 AP, heals 10% max HP, and -25% damage taken for 2 rounds. Does not end your turn.'}},
  mystic:{name:'Mystic', icon:'🔮', desc:'Draws on reserves others can\'t reach. Ember Weave ignites the field.',
    mods:{atk:8, def:3, maxAP:2},
    ability:{name:'Ember Weave', icon:'🔥', cost:0, cd:4, desc:'Ignites every living enemy target with a Burning zone, heals 10% max HP, and shields you for 40% less damage taken for 2 rounds.'}},
  paladin:{name:'Paladin', icon:'🕊️', desc:'A protector who draws strength from guarding others as much as striking. Sacred Ward shields and mends.',
    mods:{atk:6, def:9, maxAP:0},
    ability:{name:'Sacred Ward', icon:'🕊️', cost:2, cd:4, desc:'Heal 10% max HP and take 50% less damage for 2 rounds.'}}
};

// Talents — a small, flat-bonus talent list per class (no tree/prerequisites, to keep this
// reliable): each talent grants one permanent stat mod via the same effectMods() system classes
// and trinkets already use, so no new combat-code paths were needed to apply them. Points are
// earned automatically by leveling (see talentPointsEarned()) and spent one at a time from the
// Talents screen; up to all 4 of a class's talents can eventually be learned in a single run.
const TALENTS = {
  warrior:[
    {id:'warrior_ironskin', name:'Iron Skin', pair:'p1', desc:'+6 Defense.', mods:{def:6}},
    {id:'warrior_warcry', name:'War Cry', pair:'p1', desc:'+6 Attack.', mods:{atk:6}},
    {id:'warrior_bulwark', name:'Bulwark Training', pair:'p2', desc:'-9% damage taken from all sources.', mods:{dmgTakenPct:-0.09}},
    {id:'warrior_secondwind', name:'Second Wind', pair:'p2', desc:'+1 max Action Point.', mods:{maxAP:1}},
    {id:'warrior_rhythm', name:'Berserker Rhythm', pair:'p3', desc:'Builds Momentum 30% faster.', mods:{momentum:0.3}},
    {id:'warrior_appetite', name:'Slayer Appetite', pair:'p3', desc:'Heal 5% max HP whenever something dies.', mods:{killHeal:0.05}},
    {id:'warrior_crush', name:'Crushing Blows', pair:'p4', desc:'+35% critical damage.', mods:{critDmg:0.35}},
    {id:'warrior_stalwart', name:'Stalwart Guard', pair:'p4', desc:'Guard refunds +1 extra Action Point.', mods:{guardAP:1}}
  ],
  rogue:[
    {id:'rogue_precision', name:'Deadly Precision', pair:'p1', desc:'+8% critical chance.', mods:{crit:0.08}},
    {id:'rogue_shivwork', name:'Shiv Work', pair:'p1', desc:'+6 Attack.', mods:{atk:6}},
    {id:'rogue_fleet', name:'Fleet Step', pair:'p2', desc:'+1 max Action Point.', mods:{maxAP:1}},
    {id:'rogue_evasion', name:'Evasion Training', pair:'p2', desc:'-9% damage taken from all sources.', mods:{dmgTakenPct:-0.09}},
    {id:'rogue_flow', name:'Killing Flow', pair:'p3', desc:'Builds Momentum 30% faster.', mods:{momentum:0.3}},
    {id:'rogue_scavenger', name:'Scavenger', pair:'p3', desc:'Heal 5% max HP whenever something dies.', mods:{killHeal:0.05}},
    {id:'rogue_ruthless', name:'Ruthless Edge', pair:'p4', desc:'+35% critical damage.', mods:{critDmg:0.35}},
    {id:'rogue_slip', name:'Slipstream', pair:'p4', desc:'Guard refunds +1 extra Action Point.', mods:{guardAP:1}}
  ],
  mystic:[
    {id:'mystic_reserves', name:'Arcane Reserves', pair:'p1', desc:'+1 max Action Point.', mods:{maxAP:1}},
    {id:'mystic_focus', name:'Focused Mind', pair:'p1', desc:'+6 Attack.', mods:{atk:6}},
    {id:'mystic_ember', name:'Ember Mastery', pair:'p2', desc:'Your Burning zones last 1 round longer.', mods:{burnRounds:1}},
    {id:'mystic_ward', name:'Ward Sense', pair:'p2', desc:'-9% damage taken from all sources.', mods:{dmgTakenPct:-0.09}},
    {id:'mystic_conduit', name:'Conduit', pair:'p3', desc:'Builds Momentum 30% faster.', mods:{momentum:0.3}},
    {id:'mystic_siphon', name:'Soul Siphon', pair:'p3', desc:'Heal 5% max HP whenever something dies.', mods:{killHeal:0.05}},
    {id:'mystic_overcharge', name:'Overcharge', pair:'p4', desc:'+35% critical damage.', mods:{critDmg:0.35}},
    {id:'mystic_tether', name:'Tether', pair:'p4', desc:'Guard refunds +1 extra Action Point.', mods:{guardAP:1}}
  ],
  paladin:[
    {id:'paladin_devotion', name:'Devotion', pair:'p1', desc:'-9% damage taken from all sources.', mods:{dmgTakenPct:-0.09}},
    {id:'paladin_radiant', name:'Radiant Strike', pair:'p1', desc:'+6 Attack.', mods:{atk:6}},
    {id:'paladin_steadfast', name:'Steadfast', pair:'p2', desc:'+6 Defense.', mods:{def:6}},
    {id:'paladin_blessed', name:'Blessed Reserves', pair:'p2', desc:'+1 max Action Point.', mods:{maxAP:1}},

// Talent points: earned at level 3 and level 7 (2 total), and each class has 2 mutually-exclusive
// pairs (p1, p2) — so this is a real fork, not an eventual checklist: 4 possible builds per class,
// and picking one option in a pair permanently locks out the other (short of paying to respec).
const TALENT_LEVELS = [3,6,9,12];
function talentPointsEarned(){ return TALENT_LEVELS.filter(l=>game.level>=l).length; }
function talentPointsAvailable(){ return talentPointsEarned() - game.talentsChosen.length; }
function talentPairChosen(pairId){
  const list = TALENTS[game.cls] || [];
  return game.talentsChosen.find(id=>{ const t=list.find(x=>x.id===id); return t && t.pair===pairId; }) || null;
}
function sanitizeTalentsChosen(){
  const list = TALENTS[game.cls] || [];
  const seenPairs = new Set(); const kept = [];
  game.talentsChosen.forEach(id=>{
    const t = list.find(x=>x.id===id);
    if(!t || seenPairs.has(t.pair)) return;
    seenPairs.add(t.pair); kept.push(id);
  });
  game.talentsChosen = kept;
}
function respecCost(){ return 150 + game.talentsChosen.length*150; }
function respecTalents(){
  if(game.talentsChosen.length===0 || game.gold<respecCost()) return;
  game.gold -= respecCost(); game.stats.goldSpent += respecCost();
  game.talentsChosen = [];
  updatePillbar();
  openTalents();
}

// Pattern reading — repeating the same action 3 times in a row telegraphs a warning; a 4th repeat
// in a row gets punished with bonus enemy damage that round, then the streak resets. This is the
// "smarter enemies" half of the combat rework: it doesn't change what any button does, it just
// makes doing the same one over and over a cost instead of a free lunch.
function recordAction(action){
  if(!fight) return;
  if(action === fight.lastAction) fight.repeatStreak++;
  else { fight.repeatStreak = 1; fight.lastAction = action; }
  if(fight.repeatStreak === 3){
    fight.patternWarning = true;
    logf(`<span class="special" style="color:#ffb347;">👁️ Something about your rhythm is getting predictable. Mix it up, or it'll cost you.</span>`);
  } else if(fight.repeatStreak >= 4){
    fight.punishThisRound = true;
    fight.patternWarning = false;
    fight.repeatStreak = 0;
    logf(`<span class="dmg">😈 It saw that coming.</span>`);
  }
}
function gainMomentum(amt){
  if(!fight) return;
  const mult = (curStance().momentumMult || 1) + effectMods('momentum');
  fight.momentum = Math.min(MAX_MOMENTUM, fight.momentum + Math.floor(amt*mult));
}
function canUnleash(){ return !!fight && fight.momentum>=MAX_MOMENTUM; }

  Object.keys(ENEMY_POOLS).forEach(ch=>{

  });
})();

function generalStockPrice(type,name){
  if(type==='weapon') return Math.floor(WEAPONS[name].atk*13);
  return Math.floor(ARMOR[name].def*9 + ARMOR[name].hp*1.4);
}

function defaultGameState(){
  return {
    version: SAVE_VERSION,
    name:'', cls:null, difficulty:'normal',
    level:1, xp:0, xpNeeded:80,
    hp:160, maxHp:160, baseAtk:8, baseDef:7,
    gold:140, loreFragments:0, voidShards:0,
    weapon:'Rusty Blade', armor:'Cloth Wraps', trinketPassive:null, trinketActive:null,
    inventory:{weapons:['Rusty Blade'], armor:['Cloth Wraps']},
    trinketsOwned:[],
    upgrades:{weapons:{}, armor:{}},
    socketsOn:{},
    chapter:1, floor:0,
    dungeonsCleared:Array(TOTAL_CHAPTERS).fill(false),
    championDefeated:false,
    potionAtkBonus:0,
    corruption:0,
    effects:[],
    loreUnlocked:[],
    tutorialSeen:false,
    hasUnsavedProgress:false,
    gamblerCurse:false, goldRewardMult:1,
    gauntletWave:0, bestGauntletWave:0,
    bountiesClaimed:[],
    stats:{kills:0, crits:0, damageDealt:0, wagers:0, goldSpent:0, setSeen:false},
    settings:{sound:true, reduceMotion:false, fastMode:false, music:true, largeText:false},
    sandbox:{hpPct:100, dmgPct:100, godMode:false, infAP:false},
    ngPlus:0,
    morale:0,
    witnessEncountered:[],
    superbossesCleared:{},
    arenaCleared:{},
    gauntletMutators:{},
    talentsChosen:[],
    consumables:{heal:0, focus:0}
  };
}
let game = defaultGameState();
let fight = null;
let pendingConfirm = null;

function migrateSave(data){
  const base = defaultGameState();
  const merged = Object.assign(base, data);
  // Deep-merge nested objects so an old save missing newer sub-fields still gets sane defaults
  merged.inventory = Object.assign({weapons:['Rusty Blade'],armor:['Cloth Wraps']}, data.inventory||{});
  merged.upgrades = Object.assign({weapons:{},armor:{}}, data.upgrades||{});
  merged.stats = Object.assign({kills:0,crits:0,damageDealt:0,wagers:0,goldSpent:0,setSeen:false}, data.stats||{});
  merged.settings = Object.assign({sound:true,reduceMotion:false,fastMode:false,music:true,largeText:false}, data.settings||{});
  merged.consumables = Object.assign({heal:0,focus:0}, data.consumables||{});
  merged.sandbox = Object.assign({hpPct:100,dmgPct:100,godMode:false,infAP:false}, data.sandbox||{});
  // Old saves may have a shorter dungeonsCleared array from before World 2 existed — pad it out rather than truncate progress.
  merged.dungeonsCleared = Array.isArray(data.dungeonsCleared) ? data.dungeonsCleared.concat(Array(TOTAL_CHAPTERS).fill(false)).slice(0,TOTAL_CHAPTERS) : Array(TOTAL_CHAPTERS).fill(false);
  merged.bountiesClaimed = Array.isArray(data.bountiesClaimed) ? data.bountiesClaimed : [];
  merged.socketsOn = data.socketsOn || {};
  merged.effects = Array.isArray(data.effects) ? data.effects.filter(e=>e.duration==='permanent') : [];
  merged.loreUnlocked = Array.isArray(data.loreUnlocked) ? data.loreUnlocked : [];
  merged.ngPlus = typeof data.ngPlus === 'number' ? data.ngPlus : 0;
  merged.morale = typeof data.morale === 'number' ? data.morale : 0;
  merged.witnessEncountered = Array.isArray(data.witnessEncountered) ? data.witnessEncountered : [];
  merged.superbossesCleared = data.superbossesCleared || {};
  merged.arenaCleared = data.arenaCleared || {};
  merged.gauntletMutators = data.gauntletMutators || {};
  merged.talentsChosen = Array.isArray(data.talentsChosen) ? data.talentsChosen : [];
  {
    const list = TALENTS[merged.cls] || [];
    const seenPairs = new Set(); const kept = [];
    merged.talentsChosen.forEach(id=>{
      const t = list.find(x=>x.id===id);
      if(!t || seenPairs.has(t.pair)) return;
      seenPairs.add(t.pair); kept.push(id);
    });
    merged.talentsChosen = kept;
  }
  merged.version = SAVE_VERSION;
  return merged;
}
function ngMult(){ return 1 + game.ngPlus*0.4; }

/* =========================================================
   Derived stats
========================================================= */
function effectMods(key){
  let v = 0;
  game.effects.forEach(e=>{ if(e.mods && e.mods[key]) v += e.mods[key]; });
  if(game.trinketPassive && TRINKETS_PASSIVE[game.trinketPassive].mods[key]) v += TRINKETS_PASSIVE[game.trinketPassive].mods[key];
  const classTalents = TALENTS[game.cls] || [];
  classTalents.forEach(t=>{ if(game.talentsChosen.includes(t.id) && t.mods[key]) v += t.mods[key]; });
  return v;
}
function upLevel(type, name){ const d = type==='weapon'?game.upgrades.weapons:game.upgrades.armor; return d[name]||0; }
function upCost(type, name){
  const item = type==='weapon'?WEAPONS[name]:ARMOR[name];
  const b = {common:30,uncommon:55,rare:90,epic:140,legendary:210,mythic:320,primordial:460,apex:640}[item.rarity]||40;
  return Math.floor(b * (upLevel(type,name)+1) * 1.25);
}
function activeSetPieces(){
  const w = WEAPONS[game.weapon], a = ARMOR[game.armor];
  if(w && a && w.setKey && w.setKey===a.setKey) return w.setKey;
  return null;
}
function getTotalAtk(){
  const w = WEAPONS[game.weapon];
  let atk = game.baseAtk + w.atk + upLevel('weapon', game.weapon)*3 + effectMods('atk') + game.potionAtkBonus;
  if(fight && activeSetPieces()==='ashwalker') atk = Math.floor(atk * (1 + (fight.ashwalkerStacks||0)*0.03));
  return Math.floor(atk);
}
function getTotalDef(){
  const a = ARMOR[game.armor];
  return Math.floor(game.baseDef + a.def + upLevel('armor', game.armor)*3 + effectMods('def'));
}
function getMaxAP(){ const cls = CLASSES[game.cls]; const stanceBonus = (fight ? (curStance().maxAPBonus||0) : 0); return 5 + (cls?cls.mods.maxAP:0) + effectMods('maxAP') + stanceBonus; }
function getCrit(){ return Math.max(0.02, 0.15 + effectMods('crit')); }
function diffMult(){ return DIFF[game.difficulty].mult; }
function infAP(){ return game.sandbox.infAP; }
function delay(normalMs, fastMs){ return game.settings.fastMode ? fastMs : normalMs; }

/* =========================================================
   Sound
========================================================= */
let audioCtx = null;
function getRawAudioCtx(){
  if(!audioCtx){ try{ audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioCtx=null; } }
  if(audioCtx && audioCtx.state==='suspended') audioCtx.resume().catch(()=>{});
  return audioCtx;
}
function getAudioCtx(){
  if(!game.settings.sound) return null;
  return getRawAudioCtx();
}
function playTone(freq,dur,type,vol){
  const ctx = getAudioCtx(); if(!ctx) return;
  try{
    const osc=ctx.createOscillator(), gain=ctx.createGain();
    osc.type=type||'sine'; osc.frequency.value=freq;
    const v=vol===undefined?0.12:vol;
    gain.gain.setValueAtTime(v, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime+dur);
  }catch(e){}
}
function sfxHit(){ playTone(180,.1,'square',.1); }
function sfxCrit(){ playTone(880,.05,'square',.12); setTimeout(()=>playTone(1200,.12,'square',.1),40); }
function sfxHeal(){ playTone(660,.15,'sine',.1); }
function sfxLevelUp(){ [523,659,784,1046].forEach((f,i)=>setTimeout(()=>playTone(f,.2,'triangle',.12),i*90)); }
function sfxDefeat(){ playTone(110,.5,'sawtooth',.09); }
function sfxClick(){ playTone(300,.04,'square',.05); }

/* =========================================================
   Background music — fully procedural (Web Audio oscillators), so the file stays
   self-contained with no external audio assets. One ambient loop for menus/exploration,
   one slightly more intense loop for boss/superboss/rival fights. Independent on/off
   from the Sound effects toggle.
========================================================= */
let musicNodes = [];
let musicTimer = null;
let musicTrack = null;
const MUSIC_TRACKS = {
  ambient:{beat:900, chords:[[146.83,174.61,220.00],[130.81,155.56,196.00],[110.00,130.81,164.81],[98.00,116.54,146.83]],
    arp:[293.66,349.23,440.00,523.25]},
  intense:{beat:480, chords:[[110.00,130.81,164.81],[98.00,116.54,146.83],[87.31,103.83,130.81],[73.42,87.31,110.00]],
    arp:[220.00,261.63,329.63,392.00,440.00,392.00,329.63,261.63]}
};
function playMusicNote(freq, startTime, dur, vol, type){
  const ctx = getRawAudioCtx(); if(!ctx) return;
  try{
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.type = type||'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(vol, startTime+0.15);
    gain.gain.linearRampToValueAtTime(0, startTime+dur);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(startTime); osc.stop(startTime+dur+0.05);
    musicNodes.push(osc);
    osc.onended = ()=>{ const i=musicNodes.indexOf(osc); if(i>-1) musicNodes.splice(i,1); };
  }catch(e){}
}
function scheduleMusicBar(trackKey, barIndex){
  if(!game.settings.music || musicTrack !== trackKey) return;
  const ctx = getRawAudioCtx(); if(!ctx) return;
  const cfg = MUSIC_TRACKS[trackKey];
  const now = ctx.currentTime;
  const beatSec = cfg.beat/1000;
  const chord = cfg.chords[barIndex % cfg.chords.length];
  chord.forEach(f=>playMusicNote(f, now, beatSec*cfg.arp.length*0.95, 0.028, 'sine'));
  cfg.arp.forEach((f,i)=>playMusicNote(f, now + i*beatSec, beatSec*0.85, 0.045, 'triangle'));
  musicTimer = setTimeout(()=>scheduleMusicBar(trackKey, barIndex+1), cfg.beat*cfg.arp.length);
}
function stopMusic(){
  musicNodes.forEach(n=>{ try{ n.stop(); }catch(e){} });
  musicNodes = [];
  if(musicTimer){ clearTimeout(musicTimer); musicTimer = null; }
  musicTrack = null;
}
function startMusic(trackKey){
  if(!game.settings.music || !MUSIC_TRACKS[trackKey]) return;
  if(musicTrack === trackKey) return;
  stopMusic();
  musicTrack = trackKey;
  scheduleMusicBar(trackKey, 0);
}
function toggleMusicSetting(){
  game.settings.music = !game.settings.music;
  if(!game.settings.music) stopMusic();
}

function retireRun(){ game = defaultGameState(); fight = null; screenStart(); }
function restCost(){ return Math.ceil((game.maxHp - game.hp) * restRate()); }
function restAtCamp(){
  const missing = game.maxHp - game.hp;
  if(missing<=0) return;
  const fullCost = restCost();
  if(game.gold >= fullCost){
    game.gold -= fullCost;
    game.hp = game.maxHp;
  } else if(game.gold>0){
    const healed = Math.floor(game.gold / (1.2*restRate()));
    game.hp = Math.min(game.maxHp, game.hp + healed);
    game.gold = 0;
  } else {
    return;
  }
  sfxHeal();
  screenHub();
}
function enterFloorWithWarning(){
  const hpPct = game.maxHp>0 ? game.hp/game.maxHp : 1;
  if(game.hp>0 && hpPct < 0.35){
    confirmAction(`You're badly wounded (${game.hp}/${game.maxHp} HP). You can Rest at the Hub before continuing. Proceed anyway?`, enterFloor);
  } else {
    enterFloor();
  }
}

function upgradeItem(type,name){

function sellItem(type,name){
  const list = type==='weapon'?game.inventory.weapons:game.inventory.armor;
  const equipped = type==='weapon'?game.weapon:game.armor;
  if(name===equipped || list.length<=1) return;
  const def = type==='weapon'?WEAPONS[name]:ARMOR[name];
  const price = type==='weapon' ? Math.floor(def.atk*6) : Math.floor(def.def*8 + def.hp*1.2);
  game.gold += price;
  const idx = list.indexOf(name); if(idx>-1) list.splice(idx,1);
  const upDict = type==='weapon'?game.upgrades.weapons:game.upgrades.armor;
  delete upDict[name];
  if(game.socketsOn[name]) delete game.socketsOn[name];
  updatePillbar(); openInventory();
}

/* =========================================================

========================================================= */
function enterFloor(){
  if(game.dungeonsCleared[game.chapter-1]){
    confirmAction(`Replay the Chapter ${game.chapter} boss at increased strength for reduced rewards?`, ()=>startBossFight(true));
    return;
  }
  game.floor++;
  game.hasUnsavedProgress = true;
  const step = FLOOR_PLAN[game.floor-1];
  if(!step){ screenHub(); return; }
  if(step==='fight') startRegularFight();
  else if(step==='champion') startChampionFight(false);
  else if(step==='boss') startBossFight(false);
  else if(step.startsWith('npc:')) openNPC(step.split(':')[1]);
}
function continueFloor(){ screenHub(); enterFloor(); }

  const enc = WITNESS_ENCOUNTERS[game.chapter-1] || WITNESS_ENCOUNTERS[WITNESS_ENCOUNTERS.length-1];

  if(choice==='offer'){

    game.morale++;

    reward = {lore:1, shard:1};
  } else if(choice==='spare'){
    game.morale++; resultText = enc.spare; reward = enc.spareReward||{};
  } else {
    game.morale--; resultText = enc.take; reward = enc.takeReward||{};
  }
  const bits=[];
  if(reward.lore){ game.loreFragments += reward.lore; unlockNextLore(); bits.push(`+${reward.lore} Lore Fragment`); }
  if(reward.shard){ game.voidShards += reward.shard; bits.push(`+${reward.shard} Void Shard`); }
  if(reward.gold){ game.gold += reward.gold; bits.push(`+${reward.gold} Gold`); }

/* =========================================================
   COMBAT ENGINE (unified single & multi-target)
========================================================= */
function startRegularFight(){
  const pool = ENEMY_POOLS[game.chapter];
  const hpMult = diffMult()*ngMult(), dmgMult = diffMult()*ngMult()*(game.gamblerCurse?1.2:1);
  const isElite = Math.random() < 0.12;
  // From Chapter 2 on, about 3 in 10 ordinary fights are a pair of weaker enemies instead of one.
  const isGroup = !isElite && game.chapter>=2 && Math.random() < 0.3;
  const count = isGroup ? 2 : 1;
  const used = [], targets = [];
  for(let i=0;i<count;i++){
    let base, guard=0;
    do{ base = pool[Math.floor(Math.random()*pool.length)]; guard++; } while(count>1 && used.includes(base.name) && guard<20);
    used.push(base.name);
    const eliteMult = isElite ? 1.6 : 1;
    const hpG = isGroup ? 0.6 : 1, atkG = isGroup ? 0.7 : 1, rewG = isGroup ? 0.7 : 1;
    const t = {id:'e'+(i+1), name: isElite ? `✨ Elite ${base.name}` : base.name,
               hp:Math.floor(base.hp*hpMult*(1+game.floor*0.03)*eliteMult*hpG), atk:Math.floor(base.atk*dmgMult*(1+game.floor*0.025)*eliteMult*atkG),
               telegraph:null, xp:Math.floor(base.xp*(isElite?1.8:1)*rewG), gold:Math.floor(base.gold*(game.goldRewardMult||1)*(isElite?1.8:1)*rewG),
               traits: base.traits ? base.traits.slice() : [], isElite};
    t.maxHp = t.hp;
    targets.push(t);
  }
  game.gamblerCurse=false; game.goldRewardMult=1;
  beginFight(targets, {kind:'regular', elite:isElite, group:isGroup});
}
function startChampionFight(sandbox, extraOpts){
  const hpMult = sandbox? (game.sandbox.hpPct/100) : diffMult()*ngMult()*(1+ (game.chapter-1)*0.35);
  const dmgMult = sandbox? (game.sandbox.dmgPct/100) : diffMult()*ngMult()*(1+ (game.chapter-1)*0.25);
  const traitPool = Object.keys(CHAMPION_TRAITS);
  const traits = [];
  while(traits.length<2 && traits.length<traitPool.length){ const t=traitPool[Math.floor(Math.random()*traitPool.length)]; if(!traits.includes(t)) traits.push(t); }
  const dispName = CHAMPION_NAMES[Math.floor(Math.random()*CHAMPION_NAMES.length)];
  const t = {id:'champ', name:dispName, hp:Math.floor(CHAMPION_TEMPLATE.hp*hpMult), atk:Math.floor(CHAMPION_TEMPLATE.atk*dmgMult),
             telegraph:null, xp:CHAMPION_TEMPLATE.xp, gold:CHAMPION_TEMPLATE.gold, traits, isChampion:true};
  t.maxHp=t.hp;
  beginFight([t], Object.assign({kind:'champion', sandbox:!!sandbox}, extraOpts||{}));
}
function makeBossTargets(cfg, hpMult, dmgMult){
  const core = {id:'core', name:cfg.name, isCore:true, role:'core', hp:Math.floor(cfg.core.hp*hpMult), atk:Math.floor(cfg.core.atk*dmgMult), telegraph:null};
  core.maxHp = core.hp;
  const segs = cfg.segments.map(s=>{ const o=Object.assign({}, s, {hp:Math.floor(s.hp*hpMult), atk:Math.floor(s.atk*dmgMult), telegraph:null}); o.maxHp=o.hp; return o; });
  return [core].concat(segs);
}
let bossPendingTargets = null, bossPendingOpts = null;
function launchBossFight(cfg, hpMult, dmgMult, opts){
  opts = opts||{};
  const targets = makeBossTargets(cfg, hpMult, dmgMult);
  const fullOpts = Object.assign({kind:'boss', bossConfig:cfg}, opts);
  if(opts.noIntro){ beginFight(targets, fullOpts); return; }
  bossPendingTargets = targets; bossPendingOpts = fullOpts;
  render(`
    <div class="panel col boss-intro" style="text-align:center;">
      <div class="eyebrow" style="color:var(--gold);">Chapter ${cfg.chapter} Boss</div>
      <h2 style="color:var(--gold); margin:4px 0 10px;">${cfg.name}</h2>
      <p style="color:var(--dim); line-height:1.7;">${cfg.intro || `Something ahead is clearly not going to let you pass quietly.`}</p>
      <div class="btnrow" style="justify-content:center; margin-top:6px;"><button class="primary" onclick="beginFight(bossPendingTargets, bossPendingOpts)">⚔️ Begin →</button></div>
    </div>
  `);
}
function makeSuperbossTargets(cfg, hpMult, dmgMult){
  let cores;
  if(cfg.dualCore){
    cores = cfg.cores.map(c=>{ const o={id:c.id, name:c.name, isCore:true, role:'core', hp:Math.floor(c.hp*hpMult), atk:Math.floor(c.atk*dmgMult), telegraph:null}; o.maxHp=o.hp; return o; });
  } else {
    const c = {id:'core', name:cfg.name, isCore:true, role:'core', hp:Math.floor(cfg.core.hp*hpMult), atk:Math.floor(cfg.core.atk*dmgMult), telegraph:null};
    c.maxHp = c.hp; cores=[c];
  }
  const segs = (cfg.segments||[]).map(s=>{ const o=Object.assign({}, s, {hp:Math.floor(s.hp*hpMult), atk:Math.floor(s.atk*dmgMult), telegraph:null, phaseIdx:0}); o.maxHp=o.hp; return o; });
  return cores.concat(segs);
}
function launchSuperbossFight(cfg, hpMult, dmgMult, sandbox){
  const targets = makeSuperbossTargets(cfg, hpMult, dmgMult);

}
function startSuperbossFight(key){

let rivalArenaPendingTarget = null, rivalArenaPendingCfg = null;

function openSuperbossLadder(){

function startBossFight(replay){
  const cfg = BOSSES_LIST[game.chapter-1];
  const hpMult = (replay?1.3:1)*diffMult()*ngMult(), dmgMult = (replay?1.2:1)*diffMult()*ngMult();

}
function startSandboxFight(key){
  if(key==='champion'){ startChampionFight(true); return; }
  const cfg = BOSSES_LIST.find(b=>b.key===key);
  launchBossFight(cfg, game.sandbox.hpPct/100, game.sandbox.dmgPct/100, {sandbox:true});

function startBossRush(){ startChampionFight(true, {chainToBoss:true}); }
function bossRushPhase2(){
  const cfg = BOSSES_LIST[Math.max(0, game.chapter-1)];
  launchBossFight(cfg, game.sandbox.hpPct/100, game.sandbox.dmgPct/100, {sandbox:true, noIntro:true});
